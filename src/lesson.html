<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10172e">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
{{icons}}
{{head}}
<!-- Из поиска чаще всего идут дальше в приложение — браузер загружает его в фоне. -->
<link rel="prefetch" href="../../../sky.js?v={{vSky}}">
<link rel="prefetch" href="../../../app.js?v={{vApp}}">
<link rel="prefetch" href="../../../style.css?v={{vStyle}}">
<link rel="prefetch" href="../../app/text.js?v={{vText}}">
<style>
/* Страница урока для поисковиков (src/pages/lesson.ts) — без внешних файлов, как главная.
   Ограничения те же, что в style.css: Chrome 37+, без CSS-переменных, grid и flex-gap. Палитра — как в style.css. */
* { box-sizing: border-box; }
html, body { margin: 0; color: #e7ecff; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
html, body { background: #0b1020; }
a { color: #6cc4ff; }
.top { display: flex; align-items: center; height: 56px; padding: 0 24px; background: #10172e; border-bottom: 1px solid #243057; }
.brand { font-weight: 700; color: #e7ecff; text-decoration: none; }
.brand span { font-weight: 400; color: #97a3c8; }
.lang { margin-left: auto; padding: 3px 9px; border: 1px solid #243057; border-radius: 6px; color: #97a3c8; font-size: 13px; text-decoration: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
.crumb { margin: 26px 0 8px; color: #97a3c8; font-size: 14px; }
h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.2; }
h2 { margin: 30px 0 8px; font-size: 21px; }
p { margin: 0 0 12px; }
.con-names { color: #c4cbe6; font-size: 15px; }
.fig { margin: 22px 0 0; padding: 12px 14px 14px; background: #080c1d; border: 1px solid #243057; border-radius: 14px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { margin-top: 8px; color: #97a3c8; font-size: 14px; line-height: 1.45; }
.cta { margin: 22px 0; }
.btn { display: inline-block; padding: 13px 24px; border-radius: 10px; background: #2a6fdb; color: #fff; font-size: 17px; font-weight: 600; text-decoration: none; }
.btn:hover { background: #3a7ff0; }
.rows, .facts { margin: 0; padding: 0; list-style: none; }
.rows li { padding: 7px 0; border-bottom: 1px solid #1c2647; }
.rows span { color: #97a3c8; }
.rows .mag { float: right; }
.facts li { position: relative; margin: 0 0 10px; padding-left: 18px; }
.facts li:before { content: ""; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; border-radius: 3px; background: #6cc4ff; }
.prose ul { padding-left: 22px; }
.prose li { margin-bottom: 6px; }
.tbl-wrap { overflow-x: auto; margin-bottom: 12px; }
.tbl { border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { padding: 5px 12px 5px 0; border-bottom: 1px solid #1c2647; text-align: left; }
.tbl th { color: #97a3c8; font-weight: 600; }
sup { line-height: 0; }
.pager { display: flex; margin: 8px -6px 30px; }
.pager a { flex: 1; margin: 0 6px; padding: 12px 16px; background: #10172e; border: 1px solid #243057; border-radius: 12px; color: #e7ecff; text-decoration: none; }
.pager a:hover { border-color: #3f78bd; }
.pager span { display: block; color: #97a3c8; font-size: 14px; }
.pager .next { text-align: right; }
.pager .next:only-child { margin-left: auto; flex: none; width: 50%; }
.credits { padding-bottom: 28px; color: #6f7aa0; font-size: 13px; }
@media (max-width: 520px) {
  .top { padding: 0 14px; }
  .brand span { display: none; }
  .wrap { padding: 0 14px; }
  h1 { font-size: 25px; }
  .fig { margin-left: -6px; margin-right: -6px; padding: 8px; }
  .btn { display: block; text-align: center; }
  .pager .next:only-child { width: auto; flex: 1; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../../">{{page.brand}}<span> · {{page.brandSub}}</span></a>
  <a class="lang" href="{{otherLangHref}}" hreflang="{{otherLangCode}}" title="{{page.otherLangTitle}}">{{page.otherLang}}</a>
</header>
<main class="wrap">
{{body}}
</main>
<footer class="wrap credits">{{ui.credits}}</footer>
<script>
// Без сервера (file://) папка сама не открывается — дописываем index.html.
(function () {
  if (location.protocol !== 'file:') return;
  var a = document.getElementsByTagName('a');
  for (var i = 0; i < a.length; i++) {
    var h = a[i].getAttribute('href') || '', m = /^([^:#]*\/)(#.*)?$/.exec(h);
    if (m) a[i].setAttribute('href', m[1] + 'index.html' + (m[2] || ''));
  }
})();
</script>
</body>
</html>
