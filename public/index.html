<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10172e">
<title>Звёздное небо · Starry Sky</title>
<link rel="alternate" hreflang="ru" href="ru/">
<link rel="alternate" hreflang="en" href="en/">
<script>
// Открываем язык, выбранный в прошлый раз, иначе — язык браузера.
// Адрес с разделом (/#lesson/UMa) ведёт сразу в приложение, без него — на главную.
(function () {
  var lang = null;
  try { lang = JSON.parse(localStorage.getItem('sa.lang')); } catch (e) { /* нет localStorage */ }
  if (lang !== 'ru' && lang !== 'en') {
    lang = /^(ru|be|uk|kk)/i.test(navigator.language || navigator.userLanguage || '') ? 'ru' : 'en';
  }
  // Без сервера (file://) папка сама не открывается — нужен index.html.
  location.replace(lang + '/' + (location.hash ? 'app/' : '') + (location.protocol === 'file:' ? 'index.html' : '') + location.hash);
})();
</script>
<style>
  body { margin: 0; padding: 40px 20px; background: #0b1020; color: #e7ecff; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: #6cc4ff; margin: 0 10px; }
</style>
</head>
<body>
<p><a href="ru/index.html">Русский</a> <a href="en/index.html">English</a></p>
</body>
</html>
