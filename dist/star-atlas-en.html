<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10172e">
<meta name="description" content="A textbook of the night sky: constellation by constellation, with a map, star-hopping pointers and practice for astronomy olympiads.">
<title>Starry Sky — Step by Step</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310172e'/%3E%3Cpath d='M16 5l2.6 7.4L26 15l-7.4 2.6L16 25l-2.6-7.4L6 15l7.4-2.6z' fill='%236cc4ff'/%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<style>
/* Рассчитано на встроенный Chrome 37–50 (Android 5–6): без CSS-переменных, без flex-gap и grid,
   без тяжёлых эффектов (blur, большие тени).
   Палитра: фон #0b1020, панели #10172e / #161e3b, линии #243057, текст #e7ecff,
   приглушённый #97a3c8, акцент #6cc4ff, указатели #ffcf5a, верно #5fd38d, ошибка #ff6b6b. */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #0b1020;
  color: #e7ecff;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* Точно по видимой области экрана, в том числе в мобильном Chrome со скрывающейся строкой адреса. */
body {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button { font: inherit; color: inherit; cursor: pointer; }
a { color: #6cc4ff; }
.muted { color: #97a3c8; }
.small { font-size: 13px; }
sup { font-size: 0.7em; }

/* ---------- шапка ---------- */

.top {
  flex: none;
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 14px;
  background: #10172e;
  border-bottom: 1px solid #243057;
}
.brand { font-weight: 700; white-space: nowrap; margin-right: 22px; }
.brand span { font-weight: 400; color: #97a3c8; }
.tabs { display: flex; }
.tabs button {
  margin-right: 4px;
  padding: 7px 14px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: #97a3c8;
}
.tabs button:hover { color: #e7ecff; }
.tabs button.on { background: #161e3b; color: #e7ecff; box-shadow: inset 0 -2px 0 #6cc4ff; }
.prog { margin-left: auto; display: flex; align-items: center; font-size: 13px; color: #97a3c8; }
.prog-bar { width: 120px; height: 6px; margin-right: 8px; border-radius: 3px; background: #243057; overflow: hidden; }
.prog-bar i { display: block; height: 100%; width: 0; background: #5fd38d; }
a.brand { color: inherit; text-decoration: none; }
.lang { flex: none; margin-left: 14px; padding: 3px 8px; border: 1px solid #243057; border-radius: 6px; color: #97a3c8; font-size: 12px; text-decoration: none; }
.lang:hover { color: #e7ecff; }

.icon-btn { display: none; width: 40px; height: 40px; margin: 0 8px 0 -6px; padding: 11px 9px; border: 0; background: none; }
.icon-btn i { display: block; height: 2px; margin-bottom: 5px; border-radius: 1px; background: #e7ecff; }

/* ---------- раскладка ---------- */

.layout { flex: 1; display: flex; min-height: 0; position: relative; }

.lessons {
  flex: none;
  width: 260px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px 0 30px;
  background: #10172e;
  border-right: 1px solid #243057;
}
.map-col { flex: 1; min-width: 0; position: relative; }
.map-wrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; background: #080c1d; }
/* Млечный Путь — слой под картой (src/map/skymap.ts); оба позиционированы, порядок — как в разметке. */
.mw-layer { position: absolute; top: 0; left: 0; pointer-events: none; }
#sky { position: relative; display: block; touch-action: none; -ms-touch-action: none; cursor: grab; }
#sky:active { cursor: grabbing; }

.panel {
  flex: none;
  display: flex;
  flex-direction: column;
  width: 400px;
  min-height: 0;
  background: #10172e;
  border-left: 1px solid #243057;
}
.panel-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 22px 40px; }
.ref { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

body.tab-quiz .lessons, body.tab-tasks .lessons, body.tab-atlas .lessons, body.tab-ref .lessons { display: none; }
body.tab-ref .map-col, body.tab-ref .panel { display: none; }
body.tab-ref .ref { display: block; }

/* ---------- положение панели (src/ui/sheet.ts) ---------- */
/* Сбоку (компьютер, планшет, телефон боком): свёрнутая панель прячется — на карте кнопка вернуть её,
   развёрнутая занимает место карты. Снизу (телефон вертикально) — см. @media (max-width: 899px). */

.sheet-bar { flex: none; display: flex; align-items: center; height: 34px; padding: 0 4px 0 12px; border-bottom: 1px solid #1b2547; }
.grip { display: none; }
.sheet-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #97a3c8; font-size: 13px; visibility: hidden; }
.sheet-btn { flex: none; width: 36px; height: 30px; margin-left: 2px; padding: 0; border: 0; border-radius: 8px; background: none; color: #97a3c8; }
.sheet-btn:hover { background: #161e3b; color: #e7ecff; }
.sheet-btn svg, .sheet-open svg { display: block; margin: 0 auto; }
.sheet-btn.down svg { -webkit-transform: rotate(90deg); transform: rotate(90deg); }
.sheet-btn.up svg { -webkit-transform: rotate(-90deg); transform: rotate(-90deg); }
.sheet-open { display: none; position: absolute; top: 8px; right: 10px; width: 42px; height: 42px; padding: 0; border: 1px solid #243057; border-radius: 21px; background: rgba(16, 23, 46, 0.9); color: #e7ecff; }
.sheet-open svg { -webkit-transform: rotate(-90deg); transform: rotate(-90deg); }
body.sheet-min .panel { display: none; }
body.sheet-min .sheet-open { display: block; }
body.sheet-min .sheet-btn.down, body.sheet-max .sheet-btn.up { display: none; }
body.sheet-max .map-col { display: none; }
body.sheet-max .panel { flex: 1; width: auto; border-left: 0; }
body.sheet-max .panel-body { padding-left: 8%; padding-right: 8%; }

/* ---------- список уроков ---------- */

.blk { padding: 14px 16px 4px; color: #97a3c8; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
.li {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 7px 14px 7px 16px;
  border: 0;
  background: none;
  text-align: left;
  font-size: 14px;
  line-height: 1.3;
}
.li:hover { background: #161e3b; }
.li .n { flex: none; width: 26px; color: #97a3c8; font-size: 12px; }
.li .t { flex: 1; }
.li .st { flex: none; margin-left: 6px; color: #5fd38d; font-weight: 700; }
.li .st.half { color: #f0b44c; }
.li.cur { background: #1a2850; box-shadow: inset 3px 0 0 #6cc4ff; }

.vis-note { margin: 6px 0 4px; color: #f0b44c; font-size: 13px; }

.place .cities { margin: 6px 0 4px; }
.city { margin: 0 6px 6px 0; padding: 3px 9px; border: 1px solid #243057; border-radius: 12px; background: #161e3b; color: #c4cbe6; font-size: 12px; }
.city span { color: #97a3c8; }
.city:hover { border-color: #3f78bd; color: #e7ecff; }

/* ---------- элементы поверх карты ---------- */

.tools { position: absolute; top: 8px; left: 8px; right: 64px; display: flex; flex-wrap: wrap; }
.tg {
  flex: none;
  margin: 0 6px 6px 0;
  padding: 5px 11px;
  border: 1px solid #243057;
  border-radius: 14px;
  background: rgba(16, 23, 46, 0.88);
  color: #97a3c8;
  font-size: 12px;
  line-height: 1.4;
}
.tg.on { color: #fff; border-color: #3f78bd; background: rgba(38, 78, 140, 0.88); }

.zoom { position: absolute; right: 10px; bottom: 12px; }
.zoom button {
  display: block;
  width: 42px;
  height: 42px;
  margin-top: 8px;
  padding: 0;
  border: 1px solid #243057;
  border-radius: 21px;
  background: rgba(16, 23, 46, 0.9);
  font-size: 22px;
  line-height: 40px;
  text-align: center;
}
.zoom svg { vertical-align: middle; }

.banner {
  position: absolute;
  top: 46px;
  left: 50%;
  max-width: 92%;
  padding: 8px 16px;
  border: 1px solid #ffcf5a;
  border-radius: 10px;
  background: rgba(14, 20, 42, 0.95);
  font-size: 16px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  -webkit-transform: translate(-50%, -6px);
  transform: translate(-50%, -6px);
  transition: opacity 0.18s, transform 0.18s, visibility 0.18s;
}
.banner.show { opacity: 1; visibility: visible; -webkit-transform: translate(-50%, 0); transform: translate(-50%, 0); }
.banner.good { border-color: #5fd38d; color: #c9f5da; }
.banner.bad { border-color: #ff6b6b; color: #ffd0d0; }
.banner .cnt { margin-left: 8px; color: #97a3c8; font-size: 13px; }

.hint {
  position: absolute;
  left: 50%;
  bottom: 14px;
  max-width: 80%;
  padding: 7px 14px;
  border: 1px solid #243057;
  border-radius: 10px;
  background: rgba(14, 20, 42, 0.95);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  -webkit-transform: translateX(-50%);
  transform: translateX(-50%);
  transition: opacity 0.2s, visibility 0.2s;
}
.hint.show { opacity: 1; visibility: visible; }

/* ---------- панель урока ---------- */

.panel h1 { margin: 2px 0 6px; font-size: 24px; line-height: 1.2; }
.panel h2 { margin: 0 0 4px; font-size: 20px; }
.panel h3 { margin: 18px 0 6px; color: #97a3c8; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.panel p { margin: 0 0 10px; }
.crumb { color: #97a3c8; font-size: 13px; }
.con-names { margin: 2px 0 8px; color: #97a3c8; font-size: 14px; }
.abbr { color: #e7ecff; font-family: Consolas, "Roboto Mono", monospace; font-size: 13px; }
.done-badge { margin: 4px 0; color: #5fd38d; font-weight: 600; font-size: 14px; }
.c-focus { color: #6cc4ff; font-weight: 600; }
.c-known { color: #a5b0d6; font-weight: 600; }
.c-ptr { color: #ffcf5a; font-weight: 600; }

.rows { margin: 0; padding: 0; list-style: none; }
.rows li {
  display: flex;
  align-items: baseline;
  padding: 7px 8px;
  margin: 0 -8px;
  border-radius: 8px;
  cursor: pointer;
}
.rows li:hover, .rows li:active { background: #161e3b; }
.r-name { flex: none; margin-right: 10px; font-weight: 600; }
.r-sub { flex: 1; min-width: 0; color: #97a3c8; font-size: 14px; }
.r-mag { flex: none; margin-left: 8px; color: #97a3c8; font-size: 13px; }

.facts { margin: 0; padding-left: 18px; }
.facts li { margin-bottom: 7px; }

.prose h3 { margin-top: 20px; }
.prose ul { padding-left: 18px; }
.prose li { margin-bottom: 6px; }

.actions { margin-top: 22px; }
.nav-row { display: flex; margin-top: 10px; }
.nav-row .btn { flex: 1; }
.nav-row .btn + .btn { margin-left: 8px; }

.btn {
  display: inline-block;
  padding: 10px 14px;
  border: 1px solid #243057;
  border-radius: 10px;
  background: #161e3b;
  text-align: center;
}
.btn:hover { border-color: #3a4a80; }
.btn.primary { width: 100%; border-color: #3b82c4; background: #2563a6; font-weight: 600; }
.btn.primary:hover { background: #2b70bb; }
.btn:disabled { opacity: 0.4; cursor: default; }

.check-list { margin: 12px 0; }
.ci { padding: 4px 0; color: #97a3c8; }
.ci.cur { color: #e7ecff; font-weight: 600; }

/* ---------- тренировка ---------- */

.q-area { margin: 12px 0; padding: 14px; border: 1px solid #243057; border-radius: 12px; background: #161e3b; }
.q-prompt { margin-bottom: 12px; font-size: 17px; }
.opt { display: flex; align-items: center; width: 100%; margin-bottom: 8px; text-align: left; }
.opt .k {
  flex: none;
  width: 22px; height: 22px;
  margin-right: 10px;
  border-radius: 6px;
  background: #243057;
  font-size: 12px;
  line-height: 22px;
  text-align: center;
}
.opt.right { border-color: #5fd38d; background: rgba(95, 211, 141, 0.16); }
.opt.wrong { border-color: #ff6b6b; background: rgba(255, 107, 107, 0.16); }
.q-feedback { margin: 6px 0 12px; }
.q-feedback.good { color: #5fd38d; }
.q-feedback.bad { color: #ff9a9a; }
.q-score { color: #97a3c8; font-size: 14px; }
.q-settings { margin: 14px 0; }
.q-settings summary { padding: 6px 0; cursor: pointer; color: #6cc4ff; }
.opt-title { margin: 14px 0 4px; color: #97a3c8; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
.chk { display: block; padding: 5px 0; }
.chk input { margin-right: 6px; vertical-align: -2px; }
.weak span {
  display: inline-block;
  margin: 0 6px 6px 0;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(255, 107, 107, 0.14);
  color: #ffbcbc;
  font-size: 13px;
}

/* ---------- задачи ---------- */

.seg { display: flex; margin: 12px 0 4px; border: 1px solid #243057; border-radius: 10px; overflow: hidden; }
.seg-btn { flex: 1; min-width: 0; padding: 8px 4px; border: 0; background: none; color: #97a3c8; font-size: 14px; }
.seg-btn + .seg-btn { border-left: 1px solid #243057; }
.seg-btn:hover { color: #e7ecff; }
.seg-btn.on { background: #26508c; color: #fff; }
.level-hint { margin: 4px 0 6px; }
.level-up { margin: 0 0 12px; padding: 10px 12px; border: 1px solid #5fd38d; border-radius: 10px; background: rgba(95, 211, 141, 0.1); color: #c9f5da; }
.level-up .btn { display: block; margin-top: 8px; }

.task { margin: 12px 0 16px; padding: 14px 14px 16px; border: 1px solid #243057; border-radius: 12px; background: #0e1530; }
.task .crumb { margin-bottom: 6px; }
.task-text { margin-bottom: 14px; font-size: 16px; line-height: 1.5; }
.task .chk.right { color: #5fd38d; }
.task .chk.wrong { color: #ff9a9a; }
.task-multi { margin-bottom: 12px; }
.task-num { display: flex; align-items: center; margin-bottom: 12px; }
.task-num input { width: 110px; margin-right: 8px; padding: 9px 12px; border: 1px solid #243057; border-radius: 10px; background: #0b1020; color: #e7ecff; font: inherit; }
.task-num .btn { margin-left: 12px; }
.task-slots { margin-bottom: 12px; }
.task-slot { display: flex; align-items: center; margin-bottom: 8px; }
.task-slot .k { flex: none; width: 26px; height: 26px; margin-right: 10px; border-radius: 13px; border: 2px solid #ffcf5a; color: #ffcf5a; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; }
.task-slot select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #243057; border-radius: 10px; background: #0b1020; color: #e7ecff; font: inherit; }
.task-slot.right select { border-color: #5fd38d; }
.task-slot.wrong select { border-color: #ff6b6b; }
.solution { margin: 10px 0 14px; padding: 10px 12px; border-left: 3px solid #3f78bd; background: rgba(38, 78, 140, 0.18); border-radius: 0 8px 8px 0; }
.solution .opt-title { margin-top: 0; }
.solution p { margin: 4px 0 0; }

/* ---------- атлас ---------- */

.search { position: relative; margin: 10px 0; }
input[type=search], input[type=number] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #243057;
  border-radius: 10px;
  background: #0b1020;
  color: #e7ecff;
  font: inherit;
  -webkit-appearance: none;
}
.sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; border-radius: 10px; overflow: hidden; }
.sugg button {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 0;
  border-bottom: 1px solid #243057;
  background: #1b2547;
  text-align: left;
}
.sugg button:hover { background: #22305c; }
.sugg span { display: block; color: #97a3c8; font-size: 12px; }
.lat { display: block; margin: 12px 0; font-size: 14px; }
.lat input { display: inline-block; width: 86px; margin: 0 4px; padding: 6px 8px; }
.lat .muted { display: block; font-size: 12px; }
.info-card { position: relative; margin: 12px 0; padding: 14px; border: 1px solid #243057; border-radius: 12px; background: #161e3b; }
.info-card .btn { margin-top: 10px; width: 100%; }
.info-card h2 { padding-right: 34px; }
.info-x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: none; color: #97a3c8; font-size: 22px; line-height: 30px; }
.info-x:hover { background: #243057; color: #e7ecff; }
.kv { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 14px; }
.kv th { padding: 4px 10px 4px 0; color: #97a3c8; font-weight: 400; text-align: left; vertical-align: top; width: 46%; }
.kv td { padding: 4px 0; }
.legend { margin-top: 18px; font-size: 13px; color: #97a3c8; }
.legend div { margin: 4px 0; }
.lg { display: inline-block; width: 16px; height: 10px; margin-right: 8px; vertical-align: middle; border: 1.5px solid #aae6be; }
.lg-gal, .lg-gc { border-radius: 50%; }
.lg-gc { width: 11px; height: 11px; }
.lg-oc { width: 11px; height: 11px; border-radius: 50%; border-style: dashed; }
.lg-ecl { height: 0; border: 0; border-top: 2px dashed #ffbe5a; }

/* ---------- шпаргалка ---------- */

.ref-inner { max-width: 1000px; margin: 0 auto; padding: 22px 22px 60px; }
.ref h1 { margin: 0 0 8px; }
.ref h2 { margin: 28px 0 10px; font-size: 19px; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 6px 10px; border-bottom: 1px solid #243057; text-align: left; white-space: nowrap; vertical-align: top; }
.tbl th { color: #97a3c8; font-weight: 600; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover { background: #161e3b; }
.greek { display: flex; flex-wrap: wrap; }
.greek div { width: 118px; margin: 0 8px 8px 0; padding: 6px 10px; border-radius: 8px; background: #161e3b; color: #97a3c8; }
.greek b { margin-right: 8px; color: #e7ecff; font-size: 20px; }
.credits { margin-top: 30px; }

.bottom-tabs, .scrim { display: none; }

/* ---------- средние экраны: планшет боком, небольшой ноутбук ---------- */
/* Список уроков — выезжающий (кнопка ☰), чтобы карте хватало места. */

@media (max-width: 1199px) {
  .icon-btn { display: block; }
  .panel { width: 360px; }
  .tabs button { padding: 7px 10px; }

  .lessons {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 30;
    width: 84%;
    max-width: 340px;
    -webkit-transform: translateX(-105%);
    transform: translateX(-105%);
    transition: transform 0.22s ease-out;
  }
  body.drawer-open .lessons { -webkit-transform: none; transform: none; }
  body.drawer-open .scrim { display: block; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(0, 0, 0, 0.55); }
  .li { padding-top: 10px; padding-bottom: 10px; }
}

/* ---------- телефон и планшет вертикально ---------- */
/* Карта сверху, текст снизу («шторка» с ручкой): свёрнутая — одна полоска с названием, развёрнутая — без карты. */

@media (max-width: 899px) {
  html, body { font-size: 15px; }
  .top { height: 48px; padding: 0 10px; }
  .brand { margin-right: 10px; font-size: 16px; }
  .brand span { display: none; }
  .tabs { display: none; }
  .prog-bar { width: 64px; }

  .layout { flex-direction: column; padding-bottom: 56px; }
  .map-col { flex: none; height: 50vh; }
  body.tab-quiz .map-col { height: 56vh; }
  body.tab-tasks .map-col { height: 46vh; }
  body.tab-atlas .map-col { height: 60vh; }
  .panel { flex: 1; width: auto; border-left: 0; border-top: 1px solid #243057; }
  .panel-body { padding: 2px 16px 24px; }
  .panel h1 { font-size: 21px; }

  .sheet-bar { position: relative; height: 34px; padding: 0 4px 0 16px; border-bottom: 0; }
  .grip { display: block; position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: #33416f; }
  .sheet-btn.down svg { -webkit-transform: rotate(180deg); transform: rotate(180deg); }
  .sheet-btn.up svg { -webkit-transform: none; transform: none; }
  body.sheet-min .panel { display: -webkit-flex; display: flex; flex: none; height: 48px; }
  body.sheet-min .panel-body { display: none; }

<!-- Тексты южного маршрута уроков: сразу — тем, у кого сохранена южная широта; остальным приложение подгрузит их само, если понадобятся. -->
<script>
// Сгенерировано tools/build.js из texts/south.csv. Не редактировать вручную.
window.TEXT_SOUTH = {"blocks":{"s-start":"Getting started","s-cross":"Around the Southern Cross","s-canopus":"Canopus, Achernar and the Clouds","s-orion":"Orion upside down","s-scorpius":"Scorpius and Sagittarius overhead","s-autumn":"Cetus, Pegasus, Andromeda","s-leo":"Virgo, Leo, Boötes","s-north":"The northern sky — low on the horizon"},"lessons":{"intro":{"html":"<p>This is a real map of the sky: the 5,000 stars visible to the naked eye. You can drag it (with the mouse or a finger) and zoom in (with the mouse wheel, two fingers or the +/− buttons).</p>\n<h3>South is up, west is on the left</h3>\n<p>The map is turned the way the sky looks from the southern hemisphere when you face north: south up, west on the left. The “South up” button on the map switches back to the usual view of star atlases — north up, east on the left. Olympiad maps are drawn that way, so switch from time to time and learn to recognize the constellations in both views.</p>\n<h3>The size of a dot is brightness</h3>\n<p>The brightness of stars is measured in <b>magnitudes</b> (m). The <b>smaller</b> the number, the brighter the star: Sirius is −1.5<sup>m</sup>, Polaris 2<sup>m</sup>, and the faintest stars visible to the naked eye in a dark place are about 6<sup>m</sup>. A difference of 5<sup>m</sup> is exactly a factor of 100 in brightness.</p>\n<h3>How stars are named</h3>\n<p>Bright stars have proper names (Canopus, Rigel), but in problems they are more often written in <b>Bayer</b> form: a Greek letter plus the Latin genitive of the constellation — <b>α Carinae</b> = Canopus, <b>β Orionis</b> = Rigel. Usually α is the brightest star of the constellation, β the second and so on, but there are exceptions. The Greek alphabet is in the “Reference” tab — learn it first.</p>\n<h3>Coordinates</h3>\n<p>The grid on the map shows <b>equatorial coordinates</b>: declination δ (from −90° to +90°, like latitude) and right ascension α (from 0h to 24h, increasing to the east). The bright line is the celestial equator (δ = 0°).</p>\n<h3>The route for the southern hemisphere</h3>\n<p>The lessons start from the <b>Southern Cross</b>, the best-known figure of the southern sky. There is no “pole star” here: the south celestial pole is found from the Cross. Then come Canopus and the Magellanic Clouds, Orion (seen upside down from here), and Scorpius and Sagittarius, which pass right overhead in winter. The northern constellations come last: from the southern hemisphere they are low in the north, and the Big Dipper and Polaris are barely or not at all visible.</p>\n<p>The new constellation is drawn in <span class=\"c-focus\">blue</span>, the ones already learned in <span class=\"c-known\">grey</span>, and the <span class=\"c-ptr\">yellow arrows</span> show how to find the new one from stars you already know.</p>\n<p>At the end of a lesson, press <b>“Test yourself”</b>: the lines and labels disappear, and you have to find the stars yourself. Every few lessons, visit “Practice” — it asks about all the constellations you have learned.</p>"},"Cen_Cru":{"find":"The Southern Cross is the main anchor of the southern sky, like the Big Dipper in the north. Look in the Milky Way for a small bright “kite” of four stars, with two very bright stars of Centaurus next to it, <b>α (Rigil Kentaurus)</b> and <b>β (Hadar)</b>: these are the “pointers” — the line through them points to the Cross. Do not confuse it with the larger, fainter “False Cross” to the west. Extend the long bar of the Cross (<b>Gacrux → Acrux</b>) about 4.5 times — you will reach the south celestial pole. South of the Cross is the small <b>Musca</b>, the Fly.","labels":["the pointers","×4.5 to the pole"]},"SCP":{"find":"The south celestial pole is in <b>Octans</b>; there is no bright “pole star” here (σ Octantis is only 5.4<sup>m</sup>). Find the pole from the Cross: extend its long bar about 4.5 times. Around the pole are faint constellations: <b>Chamaeleon</b> (closer to the Cross), <b>Volans</b> (by Carina), <b>Apus</b> (south of Triangulum Australe) and <b>Hydrus</b> (between the pole and the Magellanic Clouds).","labels":["from the Cross to the pole"]},"Lup_TrA":{"find":"From <b>α Centauri</b> through the tiny <b>Circinus</b> to the bright, almost equilateral <b>Triangulum Australe</b> (Atria, 1.9<sup>m</sup>). From Atria ~14° to the northeast is <b>Ara</b>, the Altar: two pairs of bright stars. Between Centaurus and Ara lie <b>Lupus</b> (farther north, toward Scorpius) and the faint <b>Norma</b> (in the Milky Way).","labels":["to the Southern Triangle","~14° to Ara"]},"Argo":{"find":"From the Cross, go west along the Milky Way: after ~32° comes <b>Avior</b> (ε Carinae), and after another ~18° <b>Canopus</b>, the second brightest star in the sky (−0.7<sup>m</sup>). Around them are three parts of the ancient ship Argo: <b>Carina</b>, the Keel (with Canopus), <b>Vela</b>, the Sails (north of Carina), and <b>Puppis</b>, the Stern (farther north, toward Sirius). Between Vela and Hydra are the small <b>Pyxis</b> and <b>Antlia</b>.","labels":["~50° west along the Milky Way"]},"LMC":{"find":"Between <b>Canopus</b> and <b>Achernar</b> (a lone bright star of 0.5<sup>m</sup> on the other side of the pole from the Cross) lies the <b>Large Magellanic Cloud</b>: a hazy patch like a torn-off piece of the Milky Way. It is in <b>Dorado</b> and partly in <b>Mensa</b>. Around them are small constellations of Lacaille: <b>Reticulum</b> (a small diamond), <b>Horologium</b> (a chain from Achernar along Eridanus), <b>Pictor</b> (next to Canopus) and <b>Caelum</b> (farther north, by the river Eridanus).","labels":["from Canopus","through the pole to Achernar","along Eridanus"]},"Gru_Phe":{"find":"From <b>Achernar</b> to the northwest: after ~19° comes <b>Ankaa</b> (α Phoenicis), and after another ~25° the bright <b>Alnair</b> (1.7<sup>m</sup>), the main star of <b>Grus</b>, the Crane, with its long neck of stars. Closer to the pole is <b>Tucana</b> with the Small Magellanic Cloud. Between Grus and Cetus are the faint <b>Sculptor</b> and <b>Fornax</b> (by the river Eridanus).","labels":["from Achernar"]},"Ori":{"find":"From the southern hemisphere Orion is seen “upside down”: Rigel and Saiph are higher, Betelgeuse lower. Look for <b>three bright stars in a row</b> — the Belt; in Australia the Belt and the “sword” are called <b>“the Saucepan”</b>. Around the Belt is a quadrilateral: red <b>Betelgeuse</b> and <b>Bellatrix</b> are the northern “shoulders”, blue <b>Rigel</b> and <b>Saiph</b> the southern “knees”. Orion is the second anchor of the route after the Cross."},"CMa":{"find":"Extend Orion’s Belt ~20° to the southeast — <b>Sirius</b> (−1.5<sup>m</sup>), the brightest star of the night sky. In the southern hemisphere in summer (December — February) it passes high overhead.","labels":["the belt to the southeast"]},"CMi_Mon":{"find":"~26° east of Betelgeuse is <b>Procyon</b> (0.4<sup>m</sup>), the main star of Canis Minor. Betelgeuse, Sirius and Procyon form an almost equilateral triangle (called the Winter Triangle in the northern hemisphere). Inside the triangle is the faint <b>Monoceros</b>, the Unicorn.","labels":["Betelgeuse — Sirius — Procyon"]},"Lep_Col":{"find":"South of Orion’s feet is <b>Lepus</b>, the Hare: extend the line <b>Betelgeuse → Saiph</b> by another half — <b>Arneb</b> (α Leporis). Farther south is <b>Columba</b>, the Dove, with the star Phact, and beyond it Canopus.","labels":["half as far again","farther south"]},"Eri":{"find":"Next to <b>Rigel</b> (~3.5° to the west) is <b>Cursa</b> (β Eridani), the source of the river. From here Eridanus meanders west and then far south — down to the familiar <b>Achernar</b>, “the end of the river”.","labels":["the source near Rigel"]},"Tau":{"find":"Extend Orion’s Belt ~20° to the northwest — the orange <b>Aldebaran</b>, “the eye of the Bull”, in the V-shaped scattering of the <b>Hyades</b>. Farther in the same direction is the tiny dipper of the <b>Pleiades</b>. From the southern hemisphere the V-shaped face of the Bull is seen upside down.","labels":["the belt to the northwest","Pleiades"]},"Gem":{"find":"Extend the line <b>Rigel → Betelgeuse</b> almost twice as far — you will reach Gemini: two bright stars side by side, white <b>Castor</b> and orange <b>Pollux</b>. From the southern hemisphere Gemini stands low in the north.","labels":["Rigel → Betelgeuse"]},"Aur":{"find":"Draw a line from <b>Alnitak</b> (the eastern star of the Belt) through <b>Elnath</b> (the tip of the Bull’s horn) and extend it by another 0.6 of that distance — <b>Capella</b>, a yellow star of 0<sup>m</sup>. From the southern hemisphere Auriga is low in the north, and south of ~44° S Capella never rises.","labels":["×0.6"]},"Sco":{"find":"From <b>α Centauri</b> ~40° to the northeast is the red <b>Antares</b>, “the heart of the Scorpion”. In the southern hemisphere Scorpius is one of the most beautiful constellations: in winter (June — August) it passes almost through the zenith, and its long curved tail with the stinger is seen in full.","labels":["~40° to the northeast"]},"Sgr":{"find":"East of the Scorpion’s stinger (~11° from Shaula to Kaus Australis) is the distinctive <b>“Teapot”</b> of eight stars. Here the Milky Way is at its brightest and widest: the center of the Galaxy lies in this direction.","labels":["~11° east of the stinger"]},"CrA_Pav":{"find":"South of the “Teapot” is a graceful arc of 4–5<sup>m</sup> stars: <b>Corona Australis</b>. Farther south are <b>Telescopium</b> and <b>Pavo</b> (its brightest star is Peacock, 1.9<sup>m</sup>). To the east is <b>Indus</b>, and between Sagittarius and Grus the tiny <b>Microscopium</b>.","labels":["south of the Teapot"]},"Lib":{"find":"From <b>Antares</b> ~25° to the northwest is the dim <b>Libra</b>: a quadrilateral of 2.6–3.3<sup>m</sup> stars. The two pans of the scales are <b>Zubenelgenubi</b> (α) and <b>Zubeneschamali</b> (β); their names recall that these stars were once the claws of the Scorpion.","labels":["~25° to the northwest"]},"Oph_Ser":{"find":"From <b>Antares</b> to the north: after ~14° comes <b>Sabik</b> (η Ophiuchi), and after another ~29° <b>Rasalhague</b>, the “head” of Ophiuchus. Ophiuchus is a huge faint pentagon north of Scorpius; he holds <b>Serpens</b>, split into two parts: the Serpent’s Head to the west and its Tail to the east.","labels":["north from Antares"]},"Aql":{"find":"From <b>Nunki</b> (σ Sagittarii, the “handle” of the Teapot) ~38° to the north is <b>Altair</b> with two “guard” stars on either side, <b>Tarazed</b> and <b>Alshain</b>: all three in a line. The Milky Way runs through Aquila.","labels":["~38° north"]},"Del_Sge_Vul_Sct":{"find":"Around Altair are four small constellations. <b>Delphinus</b> is ~14° to the northeast: a small diamond with a tail. <b>Sagitta</b> is north of Altair: a thin arrow. <b>Vulpecula</b> is farther north and almost invisible. <b>Scutum</b>: extend the line Altair → δ Aquilae twice — there is a bright cloud of the Milky Way with the cluster M11.","labels":["Delphinus","Scutum ×2"]},"Cap":{"find":"From <b>Altair</b> ~22° to the south is <b>Algedi</b> (α Capricorni) at the western edge of the constellation. Capricornus is a large triangle (a “smile”, a “boat”) of 3–4<sup>m</sup> stars; its eastern corner is <b>Deneb Algedi</b>.","labels":["~22° south"]},"Aqr":{"find":"From <b>Deneb Algedi</b> (the eastern corner of Capricornus) ~16° to the north is <b>Sadalmelik</b> (α Aquarii). Next to it is the small Y-shaped <b>“Water Jar”</b>, from which Aquarius pours water south toward Fomalhaut.","labels":["~16° north"]},"PsA":{"find":"From <b>Alnair</b> (Grus) ~20° to the north is the lone bright star <b>Fomalhaut</b>. In the southern hemisphere on spring evenings (October — November) it stands almost at the zenith.","labels":["~20° north"]},"Cet":{"find":"From <b>Fomalhaut</b> ~27° to the northeast is <b>Diphda</b> (2<sup>m</sup>), the tail of Cetus. The head of Cetus — a circle of stars with <b>Menkar</b> — is farther east, and between them is the variable star Mira.","labels":["~27° to the northeast"]},"Peg":{"find":"From <b>Diphda</b> ~34° to the north is <b>Algenib</b>, a corner of the <b>Great Square of Pegasus</b>: four 2–3<sup>m</sup> stars ~15° apart. From the southern hemisphere the Square is low in the north: Markab and Algenib are higher, Scheat and Alpheratz closer to the horizon.","labels":["~34° north"]},"And":{"find":"From <b>Alpheratz</b> (the northeastern corner of the Square) a chain of bright stars runs northeast: <b>Mirach</b> and <b>Almach</b>. From Mirach go north through μ and ν Andromedae to a hazy spot — <b>M31</b>. From the southern hemisphere the Andromeda Galaxy is low in the north, and south of ~49° S it never rises.","labels":["the chain","to M31"]},"Tri_Ari":{"find":"South of <b>Mirach</b> is the small narrow <b>Triangulum</b>, and farther south <b>Aries</b>: a short curved chain of three stars, the brightest being the orange <b>Hamal</b> (2<sup>m</sup>).","labels":["south of Mirach"]},"Psc":{"find":"South of the Square of Pegasus (south of the side Markab — Algenib) is the <b>“Circlet”</b> of 5–7 faint stars, the western fish. From it a “ribbon” runs east to <b>Alrescha</b> (the knot), and from there north, toward Andromeda, runs the second fish.","labels":["south of the Square"]},"Per":{"find":"Continue the chain of Andromeda (<b>Mirach → Almach</b>) further to <b>Mirfak</b>, the brightest star of Perseus. From the southern hemisphere Perseus is seen only low in the north, and south of ~40° S Mirfak never rises.","labels":["the chain continues"]},"Vir":{"find":"From <b>α Centauri</b> to the northwest through <b>Menkent</b> (θ Centauri, ~25°) and about the same distance again is the bright blue-white <b>Spica</b>. The center of the figure of Virgo is Porrima (γ); chains of stars spread out from it like the letter Y.","labels":["via Menkent"]},"Crv_Crt":{"find":"Southwest of <b>Spica</b> (~18°) is a noticeable quadrilateral of 2.5–3<sup>m</sup> stars: <b>Corvus</b>, the Crow. Farther west is the dim <b>Crater</b>, the Cup, which looks like a goblet.","labels":["~18° to the southwest"]},"Leo":{"find":"From <b>Spica</b> to the northwest: after ~35° comes <b>Denebola</b>, “the lion’s tail”, and after another ~25° <b>Regulus</b>. The head and chest of the Lion form the “Sickle” (a backward question mark) with Regulus at its base; from the southern hemisphere the Sickle is seen upside down.","labels":["from Spica to Denebola and Regulus"]},"Hya":{"find":"Extend the line from <b>Algieba</b> through <b>Regulus</b> about 2.5–3 times more — a lone orange star, <b>Alphard</b>, the heart of Hydra. The head of Hydra is a small ring of 5–6 stars south of Cancer; the tail stretches south of Virgo almost to Libra.","labels":["×2.7"]},"LMi_Sex":{"find":"Two dim “patch” constellations. <b>Sextans</b> is right south of Regulus, an almost empty area. <b>Leo Minor</b> is north of the Lion’s head; from the southern hemisphere it is low in the north.","labels":["south of Regulus"]},"Cnc":{"find":"West of the Sickle of Leo, halfway to Gemini, is the faintest constellation of the zodiac. It is easy to find by a hazy spot — the <b>Beehive Cluster (M44)</b>, visible to the naked eye from a dark site.","labels":["~20° west"]},"Boo":{"find":"From <b>Spica</b> ~33° to the north is the orange <b>Arcturus</b> (−0.05<sup>m</sup>), the brightest star of the northern celestial hemisphere. Northerners find it along the arc of the Dipper’s handle; from the southern hemisphere it is easier from Spica. Boötes looks like a kite with Arcturus at its pointed tip.","labels":["~33° north"]},"CrB":{"find":"~20° east of Arcturus is a small <b>semicircle</b> of seven stars; the brightest is <b>Alphecca</b> (Gemma), “the jewel of the crown”.","labels":["~20° east"]},"Her":{"find":"From <b>Alphecca</b> ~15° to the east is a dim quadrilateral of 3<sup>m</sup> stars, the “Keystone”: the body of Hercules. On its western side is the globular cluster M13. From the southern hemisphere Hercules is seen low in the north.","labels":["~15° east"]},"CVn_Com":{"find":"From <b>Denebola</b> to the northeast: after ~14° comes a hazy scattering of 4–5<sup>m</sup> stars, the <b>Coma Berenices</b> cluster, and after another ~14° <b>Cor Caroli</b>, the main star of Canes Venatici. From the southern hemisphere Canes Venatici is low in the north.","labels":["from Denebola to the northeast"]},"Lyr":{"find":"From <b>Altair</b> ~34° to the north is <b>Vega</b> (0.0<sup>m</sup>), bluish-white, one of the brightest stars in the sky. From the southern hemisphere it is low in the north, and south of ~51° S Vega never rises.","labels":["~34° north"]},"Cyg":{"find":"From Vega ~24° to the east is <b>Deneb</b>, the tail of the Swan: a large cross along the Milky Way, the “Northern Cross”. From the southern hemisphere it is seen low in the north.","labels":["~24° east"]},"UMa":{"find":"From the southern hemisphere the Big Dipper is a rare guest: at ~34° S only the handle and the lower edge of the bowl rise above the northern horizon, while Dubhe and Merak never rise. Find the handle from <b>Arcturus</b>: ~31° to the north is <b>Alkaid</b>, its end. This is the same “Arc to Arcturus”, traveled the other way.","labels":["~31° north: the Dipper’s handle"]},"UMi":{"find":"Draw a line from <b>Merak</b> through <b>Dubhe</b> and extend it about 5 times that distance — <b>Polaris</b>. From the southern hemisphere it is never seen: Polaris is less than 1° from the north celestial pole, which is below the horizon.","labels":["×5"]},"Cas":{"find":"From <b>Megrez</b> through <b>Polaris</b> and the same distance again is the letter <b>W</b> of five bright stars — Cassiopeia. From the southern hemisphere it is barely visible: the whole W rises only north of ~26° S, right at the northern horizon, and from Sydney (34° S) none of its five stars ever rises.","labels":["the same again"]},"Cep":{"find":"Extend the line from <b>Schedar</b> through <b>Caph</b> about 4 times — <b>Alderamin</b>, the brightest star of Cepheus. Cepheus looks like a house with a pointed roof; from the southern hemisphere it is almost entirely below the horizon.","labels":["×4"]},"Dra":{"find":"Draco winds around the north celestial pole between the two Dippers and Vega. Its head — a quadrilateral with <b>Eltanin</b> and <b>Rastaban</b> — is closest to Vega; from the southern hemisphere it is seen low in the north, down to about 38° S."},"Cam_Lyn":{"find":"Two large faint “fillers” of the northern sky: <b>Camelopardalis</b>, between Polaris and Capella, and <b>Lynx</b>, a chain of faint stars from Capella to Ursa Major. From the southern hemisphere they are barely visible.","labels":["Camelopardalis is along this line","Lynx is along this line"]},"Equ_Lac":{"find":"<b>Equuleus</b> is a small trapezoid of faint stars between <b>Enif</b> (the muzzle of Pegasus) and <b>Delphinus</b>. <b>Lacerta</b> is a dim zigzag between <b>Deneb</b> and <b>Cassiopeia</b>; from the southern hemisphere it is barely visible.","labels":["by the muzzle of Pegasus","between Cygnus and Cassiopeia"]}}};
