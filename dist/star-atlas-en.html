":"Coathanger asterism (Collinder 399)"},"Kemble":{"label":"Kemble’s Cascade","name":"Kemble’s Cascade (a chain of stars)"},"NGC2403":{"name":"Galaxy NGC 2403"}},"greek":{"α":"alpha","β":"beta","γ":"gamma","δ":"delta","ε":"epsilon","ζ":"zeta","η":"eta","θ":"theta","ι":"iota","κ":"kappa","λ":"lambda","μ":"mu","ν":"nu","ξ":"xi","ο":"omicron","π":"pi","ρ":"rho","σ":"sigma","τ":"tau","υ":"upsilon","φ":"phi","χ":"chi","ψ":"psi","ω":"omega"},"asterisms":[{"name":"Big Dipper (Plough)","stars":"the seven bright stars of Ursa Major"},{"name":"Summer Triangle","stars":"Vega (Lyra), Deneb (Cygnus), Altair (Aquila)"},{"name":"Winter Triangle","stars":"Betelgeuse (Orion), Sirius (Canis Major), Procyon (Canis Minor)"},{"name":"Winter Hexagon","stars":"Sirius, Procyon, Pollux, Capella, Aldebaran, Rigel"},{"name":"Great Square of Pegasus","stars":"Alpheratz (Andromeda), Scheat, Markab, Algenib (Pegasus)"},{"name":"Orion’s Belt","stars":"Mintaka, Alnilam, Alnitak"},{"name":"Northern Cross","stars":"the main stars of Cygnus: Deneb, Sadr, Albireo and the wings"},{"name":"Teapot","stars":"eight stars of Sagittarius"},{"name":"Sickle of Leo","stars":"the head and chest of Leo, with Regulus"},{"name":"Keystone","stars":"the body of Hercules, with M13 nearby"},{"name":"Water Jar","stars":"four stars of Aquarius around Sadalmelik"},{"name":"Circlet","stars":"a ring of faint stars in the western fish of Pisces"},{"name":"False Cross","stars":"ε and ι Carinae, δ and κ Velorum — looks like the Southern Cross"}],"blocks":{"start":"Getting started","north":"Around Polaris","dipper":"South from the Dipper","vega":"Vega, Deneb, Altair","pegasus":"Pegasus and Andromeda","orion":"Orion and its neighbors","south":"The southern sky","theory":"The sky as a system"},"lessons":{"intro":{"title":"How to read a star map","html":"<p>This is a real map of the sky: the 5,000 stars visible to the naked eye. You can drag it (with the mouse or a finger) and zoom in (with the mouse wheel, two fingers or the +/− buttons).</p>\n<h3>North is up, east is on the left</h3>\n<p>On maps of the Earth east is on the right, but on star maps it is on the <b>left</b>. Why? A map of the Earth is a view from above, while we look at the sky from below, from the inside. Lie on your back with your head to the north, and east will be on your left. All olympiad star maps are drawn this way.</p>\n<h3>The size of a dot is brightness</h3>\n<p>The brightness of stars is measured in <b>magnitudes</b> (m). The <b>smaller</b> the number, the brighter the star: Sirius is −1.5<sup>m</sup>, Polaris 2<sup>m</sup>, and the faintest stars visible to the naked eye in a dark place are about 6<sup>m</sup>. A difference of 5<sup>m</sup> is exactly a factor of 100 in brightness.</p>\n<h3>How stars are named</h3>\n<p>Bright stars have proper names (Vega, Rigel), but in problems they are more often written in <b>Bayer</b> form: a Greek letter plus the Latin genitive of the constellation — <b>α Lyrae</b> = Vega, <b>β Orionis</b> = Rigel. Usually α is the brightest star of the constellation, β the second and so on, but there are exceptions. The Greek alphabet is in the “Reference” tab — learn it first.</p>\n<h3>Coordinates</h3>\n<p>The grid on the map shows <b>equatorial coordinates</b>: declination δ (from −90° to +90°, like latitude) and right ascension α (from 0h to 24h, increasing to the east — to the left). The bright line is the celestial equator (δ = 0°).</p>\n<h3>How the lessons work</h3>\n<p>Each lesson is one constellation (or several small ones). The new constellation is drawn in <span class=\"c-focus\">blue</span>, the ones already learned in <span class=\"c-known\">grey</span>, and the <span class=\"c-ptr\">yellow arrows</span> show how to find the new one from stars you already know. This way the sky becomes a single network that starts from the Big Dipper.</p>\n<p>At the end of a lesson, press <b>“Test yourself”</b>: the lines and labels disappear, and you have to find the stars yourself. Every few lessons, visit “Practice” — it asks about all the constellations you have learned.</p>"},"UMa":{"find":"We start with the most famous figure of the northern sky — the <b>Big Dipper</b> (the Plough). Seven bright stars: four form the bowl, three the curved handle. From the Dipper we will find almost the whole northern sky.","look":"The Dipper is only part of Ursa Major, the Great Bear: its back and tail. The head and legs are faint stars around it. The letters go like this: α, β, γ, δ around the bowl from its edge to the handle, then ε, ζ, η along the handle to its end. The two outer stars of the bowl, <b>Merak (β)</b> and <b>Dubhe (α)</b>, are the “pointers” — you will need them in the next lesson.","facts":["The brightest star of the constellation is <b>Alioth (ε)</b>, not Dubhe (α): the letters do not always follow brightness.","Next to Mizar is the faint <b>Alcor</b>. Telling them apart with the naked eye is an old test of eyesight.","The five middle stars of the Dipper move through space together (the Ursa Major Moving Group), but Dubhe and Alkaid do not. In a hundred thousand years the Dipper will change its shape.","At mid-northern latitudes (around 50–60° N) the Dipper <b>never sets</b>: it is visible on any clear night of the year.","Ursa Major is the 3rd largest constellation (after Hydra and Virgo)."]},"UMi":{"labels":["×5"],"find":"Draw a line from <b>Merak</b> through <b>Dubhe</b> and extend it about <b>5 times</b> that distance — you will reach <b>Polaris</b>, the Pole Star. It is the end of the handle of the Little Dipper.","look":"The Little Dipper looks like the Big one, but smaller, fainter and “upside down”: the handles point in opposite directions. Only three stars are easy to see: Polaris and the two stars at the edge of the bowl — <b>Kochab</b> and <b>Pherkad</b> (the “Guardians of the Pole”).","facts":["Polaris is far from the brightest star (about 2<sup>m</sup>, roughly 48th place), but it is less than 1° from the <b>north celestial pole</b>. The whole sky turns around it.","The altitude of Polaris above the horizon ≈ the <b>geographic latitude</b> of the place. At 56° N it stands 56° high; at the equator it is on the horizon.","Because of the precession of the Earth’s axis the pole slowly moves: about 4800 years ago the “pole star” was Thuban (α Draconis), and in ~12,000 years it will be Vega.","Kochab is almost as bright as Polaris (2.1<sup>m</sup>)."]},"Cas":{"labels":["the same again"],"find":"From <b>Megrez</b> (where the handle of the Dipper joins the bowl) draw a line through <b>Polaris</b> and on for the same distance. There you find the letter <b>W</b> made of five bright stars: Cassiopeia.","look":"Five stars of 2–3<sup>m</sup>: Caph (β), Schedar (α), γ, Ruchbah (δ), Segin (ε) — the letter W or M, depending on how it is turned. Cassiopeia and the Dipper are always on opposite sides of Polaris: when the Dipper is high, Cassiopeia is low, and vice versa.","facts":["Like the Dipper, Cassiopeia <b>never sets</b> at mid-northern latitudes.","γ Cassiopeiae is an irregular variable: sometimes it becomes brighter than Schedar.","In 1572 a supernova flared up here; Tycho Brahe observed it.","The Milky Way runs through Cassiopeia.","Myth: Queen Cassiopeia is the wife of Cepheus and the mother of Andromeda. The whole family (Cepheus, Andromeda, Perseus, Pegasus, Cetus) are neighbors in the sky."]},"Cep":{"labels":["×4"],"find":"Extend the line from <b>Schedar</b> through <b>Caph</b> about <b>4 times</b> — you will reach <b>Alderamin</b>, the brightest star of Cepheus.","look":"Cepheus looks like a <b>house</b> with a pointed roof. The base of the house lies in the Milky Way, and the top of the roof — the star Errai (γ) — points toward Polaris.","facts":["<b>δ Cephei</b> is the prototype of the <b>Cepheids</b>: its brightness changes with a period of 5.37 days. Cepheids are used to measure distances to other galaxies.","<b>μ Cephei</b> is Herschel’s “Garnet Star”, one of the reddest and largest known supergiants.","Because of precession, around the year 4000 AD Errai (γ Cephei) will become the pole star.","At mid-northern latitudes Cepheus never sets."]},"Dra":{"find":"Draco is long and winding. Its <b>tail</b> begins between the two Dippers (near the pointers of the Big Dipper), its <b>body</b> curves around the Little Dipper and turns back, and its <b>head</b> — a quadrilateral of four stars — looks toward bright Vega.","look":"Look for the head: a small trapezoid with two bright stars in it — <b>Eltanin (γ)</b> and <b>Rastaban (β)</b>. From the head the neck goes north and then winds like a snake to the tail.","facts":["<b>α Draconis (Thuban)</b> is only 3.7<sup>m</sup>, but about 4800 years ago, in the time of the Egyptian pyramids, it was the pole star.","The <b>north ecliptic pole</b> is in Draco — next to the Cat’s Eye Nebula.","The <b>Draconid</b> meteor shower (around October 8) radiates from the head of Draco.","Draco is the 8th largest constellation."]},"Boo":{"labels":["along the arc of the handle"],"find":"Continue the <b>arc of the Dipper’s handle</b> (Alioth → Mizar → Alkaid) for about 30° — the first bright orange star is <b>Arcturus</b>. Remember: <i>“arc to Arcturus”</i>.","look":"Boötes looks like a <b>kite</b> or an ice-cream cone: Arcturus is the bottom tip, and an elongated pentagon spreads upward from it.","facts":["<b>Arcturus</b> (−0.05<sup>m</sup>) is the brightest star of the northern celestial hemisphere and the 4th brightest in the whole sky (after Sirius, Canopus and α Centauri).","Arcturus is an orange giant 37 light-years away.","Izar (ε) is a beautiful double star: orange and bluish.","The Quadrantid meteor shower (early January) comes from the northern part of Boötes."]},"CrB":{"labels":["~20° to the left"],"find":"East of (to the left of) Arcturus, about 20° away, is a small <b>semicircle</b> of seven stars. The brightest is <b>Alphecca</b>, also called Gemma, “the jewel in the crown”.","look":"A neat arc open to the north. Very noticeable despite the modest brightness of its stars.","facts":["<b>T Coronae Borealis</b> is a recurrent nova: it flared up in 1866 and 1946 (about once in 80 years) and for a few days became visible to the naked eye. The next outburst was expected in the mid-2020s.","Alphecca is an eclipsing variable star.","Myth: this is the crown of Ariadne, which Dionysus threw into the sky."]},"Vir":{"labels":["on along the arc"],"find":"Continue the same arc from Arcturus another ~30° to the south — the bright blue-white star <b>Spica</b>. The whole rhyme: <i>“Arc to Arcturus, then speed on to Spica”</i>.","look":"Virgo is large and faint. The center of the figure is Porrima (γ); from it, chains of stars spread out like the letter <b>Y</b>: west toward Leo, north toward Vindemiatrix and southeast toward Spica.","facts":["Virgo is the <b>2nd largest</b> constellation (after Hydra).","Spica lies almost on the ecliptic: the Moon and planets often pass near it, and the Moon can cover it.","The Sun is in Virgo from about September 16 to October 31 — longer than in any other zodiac constellation.","The <b>autumnal equinox</b> point is in Virgo.","Between Denebola and Vindemiatrix lies the Virgo Cluster of galaxies. At its center is the galaxy M87: in 2019 the first image of the shadow of its black hole was obtained."]},"Leo":{"labels":["the leaky bowl"],"find":"If you poke a hole in the bottom of the Dipper’s bowl (between <b>Megrez</b> and <b>Phecda</b>), the water will pour straight onto Leo: extend the line Megrez → Phecda about 10 times — you will reach <b>Regulus</b>.","look":"The head and chest of the Lion form the <b>“Sickle”</b> (a backward question mark) with Regulus at its base. The body is a triangle whose rear corner is <b>Denebola</b>, “the lion’s tail”.","facts":["<b>Regulus</b> lies closer to the ecliptic than any other bright star — the Moon often covers it.","The Sun is in Leo from about August 10 to September 16.","The <b>Leonids</b> (November 17–18): their meteors radiate from the Sickle of Leo.","Algieba (γ) is a beautiful double of two golden stars."]},"LMi_Sex":{"title":"Leo Minor and Sextans","labels":["below Regulus"],"find":"Two dim “patch” constellations, learned by their neighbors. <b>Leo Minor</b> is between the head of Leo and the paws of Ursa Major. <b>Sextans</b> is right below Regulus (to the south), an almost empty area.","look":"Leo Minor is a small triangle of faint stars; the brightest (Praecipua) is only 3.8<sup>m</sup>. Sextans is a few stars of 4.5–5<sup>m</sup>.","facts":["Both constellations were introduced by <b>Johannes Hevelius</b> in 1687. Sextans is named after his astronomical instrument.","Leo Minor has a star β but <b>no α</b> — it was never assigned.","Sextans straddles the celestial equator."]},"CVn_Com":{"title":"Canes Venatici and Coma Berenices","labels":["below the handle","halfway"],"find":"Below the handle of the Dipper (to the south, ~15–18°) is a lone star of 3<sup>m</sup>: <b>Cor Caroli</b>, the main star of Canes Venatici. Exactly <b>halfway</b> between Cor Caroli and Denebola is a scattering of faint stars: the cluster of <b>Coma Berenices</b>.","look":"Canes Venatici has only two noticeable stars (Cor Caroli and Chara). The Hunting Dogs “run” after the Bear, driven by Boötes. Coma Berenices is a hazy scattering of 4–5<sup>m</sup> stars, easy to see from a dark site.","facts":["Coma Berenices is named after a real Egyptian queen, <b>Berenice II</b>.","The <b>north galactic pole</b> is in Coma Berenices: we look “up” out of the disk of the Milky Way, so thousands of distant galaxies are visible there.","M51, the “Whirlpool” (near Alkaid), is a famous spiral galaxy — the first in which spiral structure was seen (1845).","Cor Caroli (“Charles’s Heart”) is named after the English king Charles."]},"Cnc":{"labels":["~20° to the right"],"find":"West of (to the right of) the Sickle of Leo, halfway to Gemini, is the faintest constellation of the zodiac. It is easy to find by a hazy spot — the <b>Beehive Cluster (Praesepe, M44)</b>, visible to the naked eye outside the city.","look":"An upside-down letter <b>Y</b> of 4<sup>m</sup> stars; the Beehive is in the center, between the two “donkeys” (γ and δ).","facts":["Not a single star brighter than 3.5<sup>m</sup> — the faintest constellation of the zodiac.","The Sun is in Cancer from about July 20 to August 10.","The <b>Tropic of Cancer</b> got its name because 2000 years ago the Sun was in Cancer at the summer solstice. Because of precession, on that day the Sun is now at the border of Taurus and Gemini.","Asellus Borealis and Asellus Australis (γ and δ), the northern and southern donkeys on either side of the Beehive, are “donkeys at the manger”."]},"Hya":{"labels":["×2.7"],"find":"Extend the line from <b>Algieba</b> through <b>Regulus</b> about 2.5–3 times more — a lone orange star, <b>Alphard</b>, the heart of Hydra. The head of Hydra is a small ring of 5–6 stars below Cancer; the tail stretches below Virgo almost to Libra.","look":"A very long chain of stars: more than 100° from head to tail. Corvus and Crater sit on Hydra’s back (next lesson).","facts":["Hydra is the <b>largest constellation</b> in the sky (1303 square degrees) and the longest.","Alphard is Arabic for “the solitary one”: there are no bright stars around it.","Do not confuse it with <b>Hydrus</b>, the Little Water Snake near the south celestial pole."]},"Crv_Crt":{"title":"Corvus and Crater","labels":["~18° right and down"],"find":"Southwest of Spica (to the right and below) is a noticeable quadrilateral of 2.5–3<sup>m</sup> stars: <b>Corvus</b>, the Crow. Farther west is the dim <b>Crater</b>, the Cup, which looks like a goblet.","look":"Corvus is a “sail” or a lopsided square. Crater is a semicircular cup on a stem. Both sit on Hydra’s back.","facts":["In Corvus the star α (Alchiba, 4<sup>m</sup>) is one of the faintest in the figure: the letters were not given out by brightness.","Myth: Apollo sent the crow to fetch water in a cup; the crow dawdled and lied, blaming a water snake (Hydra). Its punishment: it sits next to the Cup but can never drink.","The colliding “Antennae” galaxies are in Corvus."]},"Lyr":{"labels":["from the head of Draco"],"find":"Next to the head of Draco (~15°) shines <b>Vega</b> — one of the brightest stars in the sky (0.0<sup>m</sup>), bluish-white. It is the first corner of the <b>Summer Triangle</b>.","look":"A small parallelogram below Vega + Vega itself = a lyre (the stringed instrument of Orpheus).","facts":["Vega is the 5th brightest star in the sky. For a long time its brightness was taken as the <b>zero point</b> of the magnitude scale.","Vega was the first star (other than the Sun) to be photographed (1850).","In ~12,000 years Vega will become the pole star.","<b>ε Lyrae is the “Double Double”</b>: binoculars show two stars, and a telescope shows that each of them is double too.","β Lyrae (Sheliak) is an eclipsing variable. Between β and γ lies the <b>Ring Nebula (M57)</b>.","The Lyrids are a meteor shower on April 22. At 56° N Vega never sets (δ = +39° > 90° − 56°)."]},"Cyg":{"labels":["~24° to the left"],"find":"From Vega to the east (left), ~24° — <b>Deneb</b>, the tail of the Swan and the second corner of the Summer Triangle.","look":"A large cross — the <b>“Northern Cross”</b>. Deneb is at the top (the tail), <b>Albireo</b> at the foot (the beak), the crossbar is the wings, and Sadr is in the center. The Swan flies south along the Milky Way.","facts":["Deneb is a distant (~2000 light-years) supergiant, tens of thousands of times more luminous than the Sun.","<b>Albireo</b> is the most beautiful colored double: a golden and a blue star (visible in a small telescope).","<b>61 Cygni</b> was the first star whose distance was measured (Bessel, 1838).","<b>Cygnus X-1</b>, the first reliable black hole candidate, is in Cygnus.","Next to Deneb is the North America Nebula."]},"Aql":{"labels":["Summer Triangle"],"find":"From Vega to the south (down), ~34° — <b>Altair</b>, the third corner of the Summer Triangle. It is easy to recognize: it has two “guard” stars on either side — <b>Tarazed</b> and <b>Alshain</b>, all three in a line.","look":"Aquila is a diamond or a small cross with a long tail to the south; Altair is on the “neck” between the guards. The Milky Way runs through Aquila.","facts":["The <b>Summer Triangle</b> (Vega, Deneb, Altair) is an asterism, not a constellation: its stars belong to three different constellations.","Altair is one of the nearest bright stars (17 light-years). It spins so fast (one turn in ~9 hours) that it is noticeably flattened.","Altair is almost on the celestial equator (δ = +9°) — it is visible from almost anywhere on Earth.","In China and Japan, Altair and Vega are the cowherd and the weaver girl, separated by the Milky Way (the Tanabata festival)."]},"Her":{"labels":["the line Alphecca — Vega"],"find":"Between <b>Alphecca</b> (Corona Borealis) and <b>Vega</b> is a dim quadrilateral of 3<sup>m</sup> stars, the “Keystone”. It lies almost exactly on the line Alphecca — Vega, closer to Alphecca. This is the body of Hercules.","look":"The Keystone and four “limbs”. Hercules hangs <b>upside down</b>: his head, Rasalgethi (α), is in the south, next to the head of Ophiuchus.","facts":["<b>M13</b> is the brightest globular cluster of the northern sky, on the western side of the Keystone. In binoculars it is a fuzzy spot. In 1974 the Arecibo radio message was sent toward it.","The Sun and the whole Solar System are moving toward Hercules (the <b>solar apex</b> is on the border with Lyra, not far from Vega).","Hercules is the 5th largest constellation.","Rasalgethi is a red giant, a variable star."]},"Oph_Ser":{"title":"Ophiuchus and Serpens","labels":["head to head"],"find":"Below Hercules is the huge but faint <b>Ophiuchus</b>. The heads of the two giants almost touch: <b>Rasalgethi</b> (α Herculis) and <b>Rasalhague</b> (α Ophiuchi) are only ~5° apart.","look":"Ophiuchus is a large elongated pentagon (a “bell”). He holds <b>Serpens</b>, the Serpent, which is split into two parts: <b>Serpens Caput</b> (the head) is to the west, below Corona Borealis; <b>Serpens Cauda</b> (the tail) is to the east, toward Aquila.","facts":["Serpens is the <b>only constellation made of two separate parts</b>.","The ecliptic passes through Ophiuchus: the Sun is there from about November 29 to December 18 — longer than in Scorpius. That is why it is called the “13th zodiac constellation”.","<b>Barnard’s Star</b>, the second nearest star system to us, is in Ophiuchus (it is faint, 9.5<sup>m</sup>).","In 1604 <b>Kepler’s Supernova</b> flared up here — the last one in our Galaxy seen with the naked eye.","In Serpens Cauda is the Eagle Nebula (M16) with the “Pillars of Creation”."]},"Sco":{"labels":["along the ecliptic"],"find":"<b>Regulus</b>, <b>Spica</b> and <b>Antares</b> lie almost on one line — the ecliptic. Extend Regulus → Spica another ~46° — the red <b>Antares</b>, “the heart of the Scorpion”.","look":"The head is a vertical arc of three stars (Dschubba, Acrab and π), then the body with Antares, and a long curved <b>tail with a stinger</b> (Shaula and Lesath).","facts":["“Antares” means “rival of Mars”: a red supergiant similar in color to Mars.","At 56° N Antares rises only ~8° above the horizon, and the tail of the Scorpion never rises at all.","The Sun spends only ~7 days in Scorpius (November 23–29).","Myth: the Scorpion stung Orion, so they are on opposite sides of the sky. At mid-latitudes they are never seen at the same time."]},"Lib":{"labels":["between Spica and Antares"],"find":"Exactly between <b>Spica</b> and <b>Antares</b>, almost on the same line (the ecliptic), is the dim Libra: a quadrilateral of 2.6–3.3<sup>m</sup> stars.","look":"The two pans of the scales are <b>Zubenelgenubi</b> (α, “the southern claw”) and <b>Zubeneschamali</b> (β, “the northern claw”). The names recall that these stars were once the claws of the Scorpion.","facts":["Libra is the only zodiac constellation that shows an object rather than a living being.","2000 years ago the autumnal equinox point was here (day equals night — “the scales”). Now it is in Virgo.","The Sun is in Libra from about October 31 to November 23."]},"Sgr":{"labels":["Deneb → Altair, the same again"],"find":"Extend the line <b>Deneb → Altair</b> by the same distance again — you will land in Sagittarius (on the star Nunki). Or look to the left (east) of the Scorpion’s tail for the characteristic <b>“Teapot”</b> of eight stars.","look":"The Teapot: the spout points west, toward the Scorpion’s tail, the handle east. “Steam” rises from the spout — the brightest cloud of the Milky Way.","facts":["In the direction of Sagittarius lies the <b>center of our Galaxy</b> (~26,000 light-years), with the supermassive black hole Sagittarius A*.","The <b>winter solstice point</b> is in Sagittarius: on December 21–22 the Sun is here, at the southernmost point of the ecliptic.","α Sagittarii (Rukbat) is only 4<sup>m</sup> and far from the Teapot.","At 56° N, Kaus Australis (δ = −34°) barely touches the horizon, so the whole Teapot is seen only farther south.","There are many nebulae and clusters here: the Lagoon (M8), the Trifid (M20), the Omega (M17) and the globular cluster M22."]},"Del_Sge_Vul_Sct":{"title":"Delphinus, Sagitta, Vulpecula, Scutum","labels":["Delphinus","Scutum ×2"],"find":"Around Altair there are four small constellations. <b>Delphinus</b> is to the northeast (left and up) ~14°: a small diamond with a tail. <b>Sagitta</b> is between Altair and Albireo: a thin arrow. <b>Vulpecula</b> is above Sagitta, almost invisible. <b>Scutum</b>: extend the line Altair → δ Aquilae twice — there is a bright cloud of the Milky Way with the cluster M11.","look":"Delphinus is one of the most lifelike figures in the sky. Sagitta is three or four stars in a line with “fletching”.","facts":["The stars of Delphinus, <b>Sualocin</b> and <b>Rotanev</b>, are a joke: read them backwards and you get Nicolaus Venator — the Latin name of the astronomer Niccolò Cacciatore.","<b>Scutum</b> is named after the coat of arms of the Polish king Jan III Sobieski (Hevelius, 1684).","Sagitta is the 3rd smallest constellation.","<b>M27, the “Dumbbell”</b> in Vulpecula, was the first planetary nebula discovered (Messier, 1764).","On the border of Vulpecula and Sagitta is the <b>“Coathanger”</b> asterism, a fine sight in binoculars."]},"Peg":{"labels":["the same again"],"find":"From <b>Polaris</b> through <b>Caph</b> (the end star of Cassiopeia) — and the same distance again: you will reach a corner of the <b>Great Square of Pegasus</b>, the star Alpheratz.","look":"A square of four 2–3<sup>m</sup> stars, ~15° on a side: <b>Alpheratz</b>, <b>Scheat</b>, <b>Markab</b>, <b>Algenib</b>. Pegasus is drawn upside down: the square is the horse’s body, the neck stretches west from Markab to the muzzle (Enif), and the front legs come from Scheat.","facts":["The corner star of the square, Alpheratz, belongs not to Pegasus but to <b>Andromeda</b> (α Andromedae).","The line Polaris — Caph — Alpheratz almost coincides with the circle <b>α = 0h</b>: both stars have a right ascension of ~0h08m.","Very few stars are visible inside the square with the naked eye — a good test of light pollution: the more stars you see inside, the darker the sky.","<b>51 Pegasi</b> was the first Sun-like star found to have a planet (1995, Nobel Prize 2019).","Pegasus is the 7th largest constellation."]},"And":{"labels":["the chain","to M31"],"find":"From <b>Alpheratz</b> (the corner of the square) a chain of bright stars runs northeast: <b>Mirach</b> and <b>Almach</b>. From Mirach go up (north) through two faint stars, μ and ν — next to ν is a hazy spot: the <b>Andromeda Galaxy, M31</b>.","look":"Two chains of stars diverging from Alpheratz — like the letter V lying on its side.","facts":["<b>M31</b> is the most distant object easily seen with the naked eye: ~2.5 million light-years.","M31 and the Milky Way are approaching each other and will collide in ~4–5 billion years.","Almach (γ) is a beautiful double: an orange and a blue star.","Myth: Andromeda, the daughter of Cepheus and Cassiopeia, was chained to a rock as a sacrifice to the sea monster Cetus; Perseus rescued her."]},"Per":{"labels":["the chain continues"],"find":"Continue the chain of Andromeda (Mirach → Almach) further — you will come to <b>Mirfak</b>, the brightest star of Perseus. Perseus stands in the Milky Way between Cassiopeia and Capella.","look":"An arc of stars around Mirfak (the “Alpha Persei cluster”) and a branch south to <b>Algol</b> — the head of Medusa in the hero’s hand.","facts":["<b>Algol, the “Demon Star”</b>, is an eclipsing variable: every 2.87 days it fades from 2.1 to 3.4<sup>m</sup> for about 10 hours. A dark companion covers the bright star.","Between Perseus and Cassiopeia is the <b>Double Cluster h & χ Persei</b>, visible to the naked eye.","The <b>Perseids</b> (August 12–13) are the best-known summer meteor shower.","At mid-northern latitudes Perseus never sets."]},"Tri_Ari":{"title":"Triangulum and Aries","labels":["down from Mirach"],"find":"Below Andromeda (south of Mirach) is a small narrow triangle of 3–4<sup>m</sup> stars: <b>Triangulum</b>. Lower still is <b>Aries</b>: a short curved line of three stars; the brightest is the orange <b>Hamal</b> (2<sup>m</sup>).","look":"Triangulum is an elongated “wedge”. Aries is a “hockey stick”: Hamal, Sheratan, Mesarthim.","facts":["<b>M33</b> is the Triangulum Galaxy (~3 million light-years), the third largest in the Local Group after M31 and the Milky Way.","The vernal equinox point, from which right ascension is counted, is called the <b>“First Point of Aries”</b>. But because of precession it has been in Pisces for ~2000 years.","The Sun is in Aries from about April 18 to May 14.","Mesarthim (γ Arietis) was one of the first double stars discovered with a telescope (Hooke, 1664)."]},"Psc":{"labels":["below the square"],"find":"Below the Great Square of Pegasus (south of the side Markab — Algenib) is the <b>“Circlet”</b>: a ring of 5–7 faint stars. This is the western fish. From the Circlet a long “ribbon” runs east to the star <b>Alrescha</b> (the knot), and from there north, under Andromeda, to the second fish.","look":"A huge letter <b>V</b> hugging the Square of Pegasus from below and from the left; Alrescha is at the point of the V.","facts":["The <b>vernal equinox point</b> is now in Pisces (α = 0h, δ = 0°), about 7° south of ω Piscium.","The Sun is in Pisces from about March 12 to April 18, including the day of the vernal equinox.","The brightest star of Pisces is η (3.6<sup>m</sup>), not α."]},"Cet":{"labels":["≈ ×2.5"],"find":"Extend the eastern side of the Square of Pegasus (<b>Alpheratz → Algenib</b>) to the south about 2.5 times — you will find <b>Diphda</b> (2<sup>m</sup>), the tail of Cetus. The head of Cetus, a circle of stars with <b>Menkar</b>, is farther east, below Aries.","look":"Cetus is huge and faint: the tail is in the west (Diphda), the head in the east (Menkar), and between them the body with the variable star Mira.","facts":["<b>Mira</b> (“the Wonderful”, ο Ceti) was the first periodic variable discovered: over ~332 days its brightness changes from 2–3<sup>m</sup> to 10<sup>m</sup>, so it is sometimes visible to the naked eye and sometimes not.","<b>τ Ceti</b> is one of the nearest (12 light-years) Sun-like stars.","Cetus is the 4th largest constellation.","Cetus is not a zodiac constellation, but the Moon and planets sometimes enter its northern part."]},"Aqr":{"labels":["down from Enif"],"find":"From <b>Enif</b> (the muzzle of Pegasus) ~11° south — <b>Sadalmelik</b> (α Aquarii). Next to it is the small Y-shaped <b>“Water Jar”</b> of four stars, from which Aquarius pours water down toward Fomalhaut.","look":"A wide faint constellation below Pegasus, between Capricornus (west) and Pisces (east). The stream of water is a chain of faint stars flowing south.","facts":["The brightest star is <b>Sadalsuud (β)</b>, not α (2.9 and 2.95<sup>m</sup>).","The Sun is in Aquarius from about February 16 to March 12.","The Eta Aquariids (early May) are meteors left by Halley’s Comet.","NGC 7293, the <b>“Helix”</b>, is one of the nearest planetary nebulae."]},"Cap":{"labels":["Vega → Altair, another 2/3"],"find":"Extend the line <b>Vega → Altair</b> by about two thirds of that distance — you will come to <b>Algedi</b> (α Capricorni) at the western edge of the constellation.","look":"A large triangle (or a “smile”, a “boat”) of 3–4<sup>m</sup> stars below Aquarius. The eastern corner is <b>Deneb Algedi</b> (δ), the brightest star.","facts":["α Capricorni is a pair visible to the naked eye (Algedi and Prima Giedi), but it is a chance alignment, not a true double.","<b>The Tropic of Capricorn</b>: 2000 years ago the Sun was in Capricornus at the winter solstice; now it is in Sagittarius.","The Sun is in Capricornus from about January 20 to February 16.","Capricornus is the smallest of the 12 classical zodiac constellations."]},"PsA":{"labels":["×3.5"],"find":"Extend the western side of the Square of Pegasus (<b>Scheat → Markab</b>) to the south about 3.5 times — a lone bright star low above the horizon: <b>Fomalhaut</b>.","look":"Fomalhaut is almost the whole constellation: the other stars are faint and form a small ring — the body of the fish.","facts":["Fomalhaut (“mouth of the fish”) is the lone bright star of the southern part of the autumn sky. At 56° N it rises only ~5°.","Around Fomalhaut is a dust disk imaged by the Hubble and Webb telescopes.","The Southern Fish drinks the water poured by Aquarius."]},"Equ_Lac":{"title":"Equuleus and Lacerta","labels":["by the muzzle of Pegasus","between Cygnus and Cassiopeia"],"find":"<b>Equuleus</b> is a small trapezoid of faint stars between <b>Enif</b> and <b>Delphinus</b>. <b>Lacerta</b> is a dim zigzag between <b>Deneb</b> and <b>Cassiopeia</b>, below Cepheus.","look":"Both constellations are “patches”: they are remembered by their neighbors, not by their shape.","facts":["Equuleus is the <b>2nd smallest</b> constellation (only Crux is smaller).","Lacerta was introduced by Hevelius (1687).","<b>BL Lacertae</b> was first taken for a variable star, but it turned out to be the core of a distant active galaxy — the prototype of <b>blazars</b>."]},"Ori":{"find":"The most recognizable constellation in the sky and the second “anchor” after the Dipper. Look for <b>three bright stars in a row</b> — Orion’s Belt. Around them is a quadrilateral: red <b>Betelgeuse</b> and <b>Bellatrix</b> above, blue <b>Rigel</b> and <b>Saiph</b> below. Pointers to the neighboring constellations start from Orion.","look":"An hourglass: the shoulders (Betelgeuse, Bellatrix), the belt (Mintaka, Alnilam, Alnitak), the knees (Saiph, Rigel). Below the belt hangs the “sword” with the Orion Nebula.","facts":["The Belt lies almost on the <b>celestial equator</b> (Mintaka has δ ≈ 0°): Mintaka rises almost exactly in the east and sets in the west. Orion is visible from every inhabited place on Earth.","Rigel (β) is usually <b>brighter</b> than Betelgeuse (α).","Betelgeuse is a red supergiant that will one day explode as a supernova. In 2019–2020 it noticeably faded (the “Great Dimming”).","The <b>Orion Nebula (M42)</b> is visible to the naked eye — the nearest large star-forming region (~1350 light-years).","The Orionids (~October 21) are meteors from Halley’s Comet."]},"Tau":{"labels":["the belt, right and up","Pleiades"],"find":"Extend Orion’s Belt to the right and up (northwest) ~20° — the orange <b>Aldebaran</b>, “the eye of the Bull”. It sits in a V-shaped scattering of stars — the <b>Hyades</b> cluster. Farther in the same direction is a tiny “dipper” of 6–7 stars: the <b>Pleiades</b>.","look":"The face of the Bull is the letter <b>V</b> (the Hyades and Aldebaran). Two long horns go east: to Elnath and to ζ Tauri.","facts":["The <b>Hyades</b> are the nearest open cluster (~150 light-years). Aldebaran (65 light-years) is not part of it — it is just in the foreground.","The <b>Pleiades</b> (the “Seven Sisters”) are a cluster of young hot stars ~440 light-years away; 6–7 stars are visible to the naked eye.","<b>M1, the Crab Nebula</b>, near the southern horn, is the remnant of the supernova of 1054 recorded by Chinese astronomers; there is a pulsar inside.","The Sun is in Taurus from about May 14 to June 21. The Moon often covers Aldebaran and the Pleiades.","Elnath (β) used to be counted as a star shared with Auriga (γ Aurigae)."]},"Aur":{"labels":["≈ ×5"],"find":"Extend the top edge of the bowl (<b>Megrez → Dubhe</b>) about 5 times — you will reach <b>Capella</b>, a yellow star of 0<sup>m</sup>. Capella stands high above Orion, almost above Elnath.","look":"A pentagon with Capella at the top corner; the bottom corner is Elnath (in Taurus). Next to Capella is a small triangle, “the Kids”.","facts":["Capella is the 6th brightest star in the sky and the <b>northernmost</b> of the 0<sup>m</sup> stars; at 56° N it never sets.","Capella is actually two yellow giant stars orbiting each other.","<b>ε Aurigae</b> is an eclipsing star with a record period: once every 27 years a huge dark disk covers it for ~2 years.","Three open clusters, M36, M37 and M38, form a chain inside the pentagon."]},"Gem":{"labels":["the diagonal of the bowl ×4","Rigel → Betelgeuse"],"find":"Two ways. 1) Extend the diagonal of the bowl, <b>Megrez → Merak</b>, about 4 times — right onto Castor. 2) The line <b>Rigel → Betelgeuse</b>, extended almost twice as far, also leads to Gemini. The two bright stars side by side are the heads of the twins: <b>Castor</b> (white) and <b>Pollux</b> (orange, slightly brighter).","look":"Two parallel chains of stars — the brothers’ bodies — run down from Castor and Pollux toward Orion.","facts":["<b>Pollux (β) is brighter than Castor (α)</b> — another exception to the rule of letters.","Castor is a sextuple star system: three pairs of binaries.","At the feet of the Twins runs the border with Taurus, and next to it lies the <b>summer solstice point</b>. Because of precession it moved from Gemini into Taurus in 1990 and is still only 0.1° from the border.","The <b>Geminids</b> (December 13–14) are the strongest meteor shower of the year.","Pluto was discovered in Gemini in 1930 (Clyde Tombaugh).","The Sun is in Gemini from about June 21 to July 20."]},"CMa":{"labels":["the belt, left and down"],"find":"Extend Orion’s Belt to the left and down (southeast) ~20° — <b>Sirius</b> (−1.5<sup>m</sup>), the brightest star of the night sky.","look":"The Dog stands on its hind legs: Sirius is on the neck, and below is the triangle Adhara — Wezen — Aludra (the legs and tail).","facts":["Sirius is the brightest star of the night sky and one of the nearest (8.6 light-years).","Sirius has a companion — the white dwarf <b>Sirius B</b> (“the Pup”).","At 56° N Sirius rises only ~17°, so it twinkles strongly in different colors.","In ancient Egypt the first morning rising of Sirius foretold the flooding of the Nile.","4° south of Sirius is the cluster M41, visible to the naked eye."]},"CMi_Mon":{"title":"Canis Minor and Monoceros","labels":["Winter Triangle"],"find":"East of (to the left of) Betelgeuse by ~26° is <b>Procyon</b> (0.4<sup>m</sup>), the main star of Canis Minor. Betelgeuse, Sirius and Procyon form an almost equilateral <b>Winter Triangle</b>. Inside the triangle is the dim <b>Monoceros</b>, the Unicorn.","look":"Canis Minor has only two noticeable stars (Procyon and Gomeisa). Monoceros has no stars brighter than 3.7<sup>m</sup>, but the Milky Way runs through it.","facts":["Procyon is one of the nearest stars (11.5 light-years); like Sirius, it has a white dwarf companion.","“Procyon” means “before the dog”: at mid-northern latitudes it rises a little before Sirius.","β Monocerotis is a beautiful triple star.","The <b>Rosette</b> Nebula is in Monoceros."]},"Lep_Col":{"title":"Lepus and Columba","labels":["another half","farther south"],"find":"At Orion’s feet sits <b>Lepus</b>, the Hare: extend the line <b>Betelgeuse → Saiph</b> by another half — you will reach <b>Arneb</b> (α Leporis). Farther south, low above the horizon, is <b>Columba</b>, the Dove, with the star Phact.","look":"Lepus is a “butterfly” or an uneven quadrilateral of 3<sup>m</sup> stars. Columba is a short chain of stars below Lepus.","facts":["The Hare runs away from the hunter Orion and his dogs.","Columba was introduced by Plancius (1592); it is Noah’s dove.","<b>R Leporis</b> is “Hind’s Crimson Star”, one of the reddest stars in the sky."]},"Eri":{"labels":["the source near Rigel"],"find":"Next to <b>Rigel</b> (~3.5° to the west) is <b>Cursa</b> (β Eridani), the source of the river. From here Eridanus meanders west, then far south — down to <b>Achernar</b> (0.5<sup>m</sup>), “the end of the river”.","look":"The river is a long winding chain of 3–4<sup>m</sup> stars. Only its very end is bright — Achernar.","facts":["Eridanus is the 6th largest constellation and stretches almost 60° in declination.","Achernar cannot be seen from mid-northern latitudes: its δ = −57°, so it rises only south of latitude 33° N.","<b>ε Eridani</b> is one of the nearest Sun-like stars (10.5 light-years).","Achernar spins so fast that it is strongly flattened — one of the flattest stars ever studied."]},"Cam_Lyn":{"title":"Camelopardalis and Lynx","labels":["Camelopardalis is along this line","Lynx is along this line"],"find":"Two large but very dim “fillers” of the northern sky. <b>Camelopardalis</b>, the Giraffe, is a huge empty area between Polaris, Cassiopeia and Capella. <b>Lynx</b> is a long chain of faint stars from Capella to the front paws of Ursa Major.","look":"There are no bright figures. Remember: the Giraffe is between Polaris and Capella, the Lynx between Capella and the Dipper.","facts":["Legend says Hevelius named it Lynx because you need the eyes of a lynx to find it.","Camelopardalis was introduced by Plancius (1612).","<b>Kemble’s Cascade</b> in Camelopardalis is a chain of ~20 stars, beautiful in binoculars.","At mid-northern latitudes both constellations almost never set."]},"Cen_Cru":{"title":"Centaurus, Crux, Musca","labels":["the pointers","×4.5 to the pole"],"find":"This part of the sky is no longer visible from mid-northern latitudes. Move south from Virgo and Hydra: below them is <b>Centaurus</b>. Its two brightest stars, <b>α (Rigil Kentaurus)</b> and <b>β (Hadar)</b>, are the “pointers” to the <b>Southern Cross</b> (Crux). Extend the long bar of the Cross (<b>Gacrux → Acrux</b>) 4.5 times — you will reach the south celestial pole. Below the Cross is the small <b>Musca</b>, the Fly.","look":"The Cross is a small “kite” of four bright stars. Centaurus is large and wraps around the Cross on three sides.","facts":["<b>α Centauri</b> is the nearest star system (4.3 light-years). Its third star, <b>Proxima</b>, is the nearest star to the Sun (4.24 light-years).","The Southern Cross is the <b>smallest constellation</b> in the sky (88th by area). It is shown on the flags of Australia, New Zealand and Brazil.","There is no bright star at the south celestial pole: the nearest noticeable one is σ Octantis (5.4<sup>m</sup>).","<b>ω Centauri</b> is the brightest globular cluster in the sky. Next to the Cross is the dark <b>Coalsack</b> nebula.","Rigil Kentaurus (δ ≈ −61°) never rises north of latitude 29° N."]},"Argo":{"title":"The ship Argo: Carina, Puppis, Vela, Pyxis, Antlia","labels":["~36° south of Sirius"],"find":"Continue south from <b>Sirius</b> ~36° — <b>Canopus</b>, the second brightest star in the sky (−0.7<sup>m</sup>). Around it are three parts of the ancient huge constellation Argo Navis: <b>Carina</b>, the Keel (with Canopus), <b>Puppis</b>, the Stern (southeast of Canis Major), and <b>Vela</b>, the Sails. Between them and Hydra are the small <b>Pyxis</b> and <b>Antlia</b>.","look":"The Milky Way runs through the Ship. Bright ones: Canopus, Naos, Suhail, γ Velorum, and near Carina the “False Cross” (ε, ι Carinae and δ, κ Velorum), which is mistaken for the Southern Cross.","facts":["Argo Navis was so big that in the 18th century <b>Lacaille</b> split it into Carina, Puppis and Vela. The letters stayed shared: Puppis and Vela have <b>no α or β</b>.","Canopus cannot be seen from mid-northern latitudes: it rises only south of latitude 37° N.","Spacecraft use Canopus to orient themselves (star trackers).","<b>η Carinae</b> is one of the most massive stars in the Galaxy. In 1843 it flared up and briefly became the second brightest star in the sky.","Pyxis and Antlia were introduced by Lacaille — he liked to name constellations after instruments."]},"Lup_TrA":{"title":"Lupus, Norma, Circinus, Triangulum Australe, Ara","labels":["to the Southern Triangle","below the stinger"],"find":"Between Centaurus and Scorpius are five small constellations. <b>Lupus</b>, the Wolf, is between Centaurus and Scorpius. <b>Circinus</b> is tiny, next to α Centauri. <b>Triangulum Australe</b> is a bright triangle (Atria, 1.9<sup>m</sup>) east of α Centauri. <b>Norma</b> is dim, between Lupus and Triangulum Australe. <b>Ara</b>, the Altar, is below the tail of Scorpius.","look":"The most noticeable are Triangulum Australe (almost equilateral) and Ara (two pairs of bright stars).","facts":["Lupus and Ara are ancient constellations of Ptolemy. Triangulum Australe was invented by the Dutch navigators Keyser and de Houtman; Circinus and Norma by Lacaille.","The Milky Way runs through Norma and Ara.","“Atria” is short for <i>Alpha Trianguli Australis</i>.","The northern part of Lupus rises above the horizon at latitudes around 45° N."]},"CrA_Pav":{"title":"Corona Australis, Telescopium, Pavo, Indus, Microscopium","labels":["south of the Teapot"],"find":"Below the “Teapot” of Sagittarius is a graceful arc of 4–5<sup>m</sup> stars: <b>Corona Australis</b>, the Southern Crown. Farther south are <b>Telescopium</b> and <b>Pavo</b>, the Peacock (its brightest star is Peacock, 1.9<sup>m</sup>). To the east (left) is <b>Indus</b>, and between Sagittarius and Piscis Austrinus is the tiny <b>Microscopium</b>.","look":"Corona Australis looks like Corona Borealis — a small arc. The others are faint “patches”.","facts":["Corona Australis is an ancient constellation of Ptolemy; Pavo and Indus are by Keyser and de Houtman; Telescopium and Microscopium by Lacaille.","The name “Peacock” was given in the 1930s for a navigational almanac.","<b>ε Indi</b> is one of the nearest stars (12 light-years), with a pair of brown dwarfs around it."]},"Gru_Phe":{"title":"Grus, Phoenix, Tucana, Sculptor, Fornax","labels":["~20° south","to Achernar"],"find":"Below Fomalhaut (~20° south) is <b>Grus</b>, the Crane, with the bright <b>Alnair</b> (1.7<sup>m</sup>) and a long neck made of a chain of stars. To the east, on the way to Achernar, is <b>Phoenix</b> (Ankaa). Between Fomalhaut and Cetus are the dim <b>Sculptor</b> and <b>Fornax</b> (by the river Eridanus). <b>Tucana</b> is closer to the pole; the Small Magellanic Cloud is in it.","look":"Grus is a long diagonal chain of stars. The rest are faint areas around the south galactic pole.","facts":["The <b>south galactic pole is in Sculptor</b>.","The “Hubble Ultra Deep Field” (2004) is an image of a tiny patch of sky in <b>Fornax</b>: it shows ~10,000 galaxies.","<b>47 Tucanae</b> is the second brightest globular cluster in the sky after ω Centauri.","β Gruis is a red giant next to blue-white Alnair: a striking color contrast."]},"LMC":{"title":"The Large Magellanic Cloud and neighbors","labels":["from Canopus","along Eridanus"],"find":"Between <b>Canopus</b> and <b>Achernar</b> is an area without bright stars but with the <b>Large Magellanic Cloud</b>: it looks like a torn-off piece of the Milky Way. The LMC is in <b>Dorado</b> and partly in <b>Mensa</b>. Around them are small constellations of Lacaille: <b>Reticulum</b> (a small diamond), <b>Horologium</b> (a chain along Eridanus), <b>Caelum</b> (between Columba and Eridanus) and <b>Pictor</b> (next to Canopus).","look":"Everything here is dim: learn it by the neighbors — Canopus, Achernar, the LMC.","facts":["The LMC is a satellite of our Galaxy, ~160,000 light-years away.","In 1987 the <b>supernova SN 1987A</b> flared up in the LMC — the nearest in 400 years. For the first time in history, neutrinos from a supernova explosion were detected.","<b>Mensa</b> is the only constellation named after a place on Earth: Table Mountain near Cape Town, where Lacaille worked. It is also the faintest: all its stars are fainter than 5<sup>m</sup>.","<b>β Pictoris</b> is a star with a dust disk and planets."]},"SCP":{"title":"Around the south pole","labels":["from the Cross to the pole"],"find":"The <b>south celestial pole</b> is in <b>Octans</b>; there are no bright stars nearby (σ Octantis is only 5.4<sup>m</sup>). Between the pole and the Magellanic Clouds is <b>Hydrus</b>. Below the Southern Cross (closer to the pole) is <b>Chamaeleon</b>, next to Carina is <b>Volans</b>, the Flying Fish, and below Triangulum Australe is <b>Apus</b>, the Bird of Paradise.","look":"Everything is faint. Anchors: the Southern Cross, Achernar, the Magellanic Clouds.","facts":["σ Octantis is the “southern pole star”, but it is barely visible to the naked eye.","<b>β Hydri</b> (2.8<sup>m</sup>) is the star brighter than 3<sup>m</sup> nearest to the south celestial pole.","The octant was an instrument that came before the sextant; the constellation was introduced by Lacaille.","Volans, Chamaeleon, Apus and Hydrus are constellations of the Dutch navigators Keyser and de Houtman (1590s)."]},"zodiac":{"title":"The ecliptic and the zodiac","html":"<p>The map is turned so that the <b>north ecliptic pole</b> is in the center, and the ecliptic itself (the orange dashed line) is a large ring. The Sun travels along it during the year; the dots show where it is on the 1st of each month.</p>\n<h3>13 constellations on the ecliptic</h3>\n<p>The Sun passes through 13 constellations — the 12 of the “zodiac” and <b>Ophiuchus</b>. In order (from west to east, the way the Sun moves): Pisces → Aries → Taurus → Gemini → Cancer → Leo → Virgo → Libra → Scorpius → Ophiuchus → Sagittarius → Capricornus → Aquarius.</p>\n<div id=\"zodiac-table\"></div>\n<p>These are <b>not</b> the astrological “signs”: because of precession and the unequal sizes of the constellations, the dates differ a lot. The Sun spends less than a week in Scorpius and about 45 days in Virgo.</p>\n<h3>How to use this in problems</h3>\n<ul>\n  <li>The constellation the Sun is in right now is <b>not visible</b> (it is in the daytime sky).</li>\n  <li>The constellation <b>opposite</b> the Sun (12h away in right ascension) is visible all night; at midnight it is in the south.</li>\n  <li>The <b>full Moon</b> is always opposite the Sun: in December it is in Gemini or Taurus, in June in Sagittarius or Ophiuchus.</li>\n  <li>The Moon and planets are always close to the ecliptic (within a few degrees).</li>\n</ul>\n<h3>Special points</h3>\n<ul>\n  <li>Vernal equinox (α = 0h) — in <b>Pisces</b>.</li>\n  <li>Summer solstice (α = 6h) — in <b>Taurus</b>, right at the border with Gemini (until 1990 it was in Gemini).</li>\n  <li>Autumnal equinox (α = 12h) — in <b>Virgo</b>.</li>\n  <li>Winter solstice (α = 18h) — in <b>Sagittarius</b>.</li>\n</ul>"},"milkyway":{"title":"The Milky Way","html":"<p>In the center of the map is the <b>north galactic pole</b> (in Coma Berenices), so the Milky Way lies as a ring around the edge. It is the disk of our Galaxy, seen from the inside.</p>\n<h3>Which constellations it passes through</h3>\n<p>Cassiopeia → Perseus → Auriga → (the edge of Gemini and Orion) → Monoceros → Puppis → Vela → Carina → Crux → Centaurus → Norma → Scorpius → Sagittarius → Scutum → Aquila → Vulpecula → Cygnus → Cepheus → Cassiopeia.</p>\n<p>And the other way round: it does <b>not</b> pass through Ursa Major, Leo, Virgo, Pegasus or Pisces — there we look “sideways” out of the disk and see distant galaxies.</p>\n<h3>Reference points</h3>\n<ul>\n  <li>The <b>Galactic Center</b> is in Sagittarius (near the border with Scorpius and Ophiuchus). Here the Milky Way is brightest and widest.</li>\n  <li>The <b>anticenter</b> is in Taurus, near the border with Auriga.</li>\n  <li>The <b>north galactic pole</b> is in Coma Berenices, the <b>south</b> one in Sculptor.</li>\n  <li>The dark lane that “splits” the Milky Way from Cygnus to Sagittarius is the <b>Great Rift</b>: clouds of dust in front of the stars.</li>\n</ul>\n<p>By the way: the Milky Way and the ecliptic cross in two places — in Gemini/Taurus and in Sagittarius. That is why the Moon and planets periodically pass in front of the Milky Way exactly there.</p>"},"coords":{"title":"Coordinates and visibility","html":"<p>Most olympiad problems about the starry sky are solved with three formulas and knowing where the bright stars are.</p>\n<h3>Is a star visible at latitude φ</h3>\n<ul>\n  <li>A star <b>never sets</b> if δ &gt; 90° − φ.</li>\n  <li>A star <b>never rises</b> if δ &lt; −(90° − φ).</li>\n  <li>Altitude at upper culmination (in the south): <b>h = 90° − φ + δ</b>.</li>\n</ul>\n<p>Example: φ ≈ 56° (Moscow, Edinburgh). Never set: stars with δ &gt; 34° (Vega, Capella, Deneb, the Dipper). Never rise: stars with δ &lt; −34° (Canopus, Achernar, the Southern Cross). Sirius (δ = −17°) rises to 90 − 56 − 17 = 17°.</p>\n<h3>Which stars are in the south at midnight</h3>\n<p>The right ascension of the Sun on March 21 is ≈ 0h and grows by about <b>2h per month</b>. At midnight the stars in the south have α ≈ α<sub>Sun</sub> + 12h.</p>\n<p>Example: on January 1 the Sun has α ≈ 18h40m, so at midnight α ≈ 6h40m is in the south — that is Sirius (6h45m). On winter nights Orion is visible, on summer nights Scorpius.</p>\n<h3>Sidereal time</h3>\n<p>A star culminates when the <b>local sidereal time</b> equals its right ascension. A sidereal day is 3 min 56 s shorter than a solar day, so every evening the stars rise ~4 minutes earlier, and in a month the picture of the sky shifts by ~2 hours.</p>\n<h3>Precession</h3>\n<p>The Earth’s axis traces a cone over ~26,000 years. That is why the celestial pole (Thuban → Polaris → Vega), the equinox points (the vernal one moved from Aries to Pisces) and the dates when the Sun is in each constellation slowly shift.</p>\n<p>A table of the brightest stars with coordinates is in the “Reference” tab. In the “Atlas”, tap any star to see its coordinates and its altitude above the horizon at your latitude.</p>"}},"tasks":{"title":"Problems","intro":"Olympiad-style problems on knowing the sky. Your answer is checked at once; then you see the solution and the picture on the map.","topicsTitle":"Topics","topics":{"map":"Constellations on a map without lines","vis":"Visibility and altitude of stars","sun":"The Sun, the Moon and the seasons","stars":"Stars and constellations","solved":"Problems with detailed solutions"},"allSky":"The whole sky, not only what is visible from my latitude","levelTitle":"Difficulty","levels":{"easy":"Easy","mid":"Medium","hard":"Hard"},"levelHint":{"easy":"Bright stars and well-known constellations; declinations are given; the options are clearly different.","mid":"The brightest stars; you need to remember declinations at least roughly.","hard":"Faint constellations, stars of 2nd–3rd magnitude, close options, more precise answers, dates near constellation borders."},"levelUp":"Five correct answers in a row — try the “{level}” level.","levelUpBtn":"Try it","check":"Check","next":"Next problem →","wrongAnswer":"Wrong. The right answer: {answer}","partly":"{ok} of {n} correct. The right answer: {answer}","solutionTitle":"Solution","choose":"— choose —","numberPlaceholder":"number","enterNumber":"Enter a number, e.g. 42 or 17.5","score":"Solved correctly: {ok} of {n}","noTopics":"Choose at least one topic.","guideTitle":"How to solve problems on knowing the sky","guide":["<b>A map without lines.</b> Start with the most noticeable figures: the Big Dipper, Cassiopeia, Orion’s Belt, the Summer Triangle, the Square of Pegasus. From them, move to the neighbors using the pointers from the lessons. Remember: on sky maps east is on the left.","<b>The Milky Way on a map is a hint.</b> It runs through Cassiopeia, Perseus, Auriga, Cygnus, Aquila, Scutum, Sagittarius, Scorpius, Puppis, Vela and Crux. It is absent from Ursa Major, Leo, Virgo, Boötes, Pegasus and Pisces.","<b>Visibility at latitude φ.</b> A star never sets if δ &gt; 90° − φ and never rises if δ &lt; −(90° − φ); in the southern hemisphere it is the other way round. Its highest altitude (upper culmination) is h = 90° − |φ − δ|.","<b>The altitude of the celestial pole equals the latitude.</b> Polaris is less than 1° from the pole, so its altitude ≈ φ. The southern hemisphere has no bright pole star — the pole is found from the Southern Cross. Stars with δ = φ culminate at the zenith.","<b>What is visible in which season.</b> The Sun’s α ≈ 0h on March 21 and grows by 2h per month. At midnight the stars with α ≈ α of the Sun + 12h culminate (in the south from the northern hemisphere, in the north from the southern); in the evening at about 10 pm, α ≈ α of the Sun + 10h.","<b>The Sun and the Moon.</b> The Sun passes through 13 constellations, including Ophiuchus; the dates are in the table “The Sun in the constellations” and differ from the “zodiac signs”. The full Moon is opposite the Sun.","<b>Star designations.</b> α is usually, but not always, the brightest star (exceptions: Orion, Gemini, Ursa Major, Pisces, Aquarius). The constellation name is in the Latin genitive: α Lyrae, β Orionis.","<b>Check your answer with common sense.</b> A star with δ &lt; 0 is never seen from the North Pole; from the equator the whole sky is visible during a year; the constellation where the Sun is now is not visible at night."],"materials":"Tables for solving are in the “Reference” tab: the brightest stars with coordinates, the Sun in the constellations, what is in the south at midnight, the constellations at your latitude.","openRef":"Open the Reference","gen":{"map":{"text":"On a part of a star map without lines and labels, numbers mark the brightest stars of several constellations. Name these constellations.","solution":"{list}. Look for familiar figures and the brightest stars first, then move to their neighbors."},"vis":{"text":"How does the star <b>{star}</b> behave in {city} (φ = {lat}°)?","options":["it never sets","it rises and sets","it never rises"],"solution":"The star’s declination is δ = {dec}. At latitude {lat}°, stars with δ &gt; 90° − φ = {up}° never set, and stars with δ &lt; −(90° − φ) = −{up}° never rise. So {answer}.","solutionSouth":"The star’s declination is δ = {dec}. At latitude {lat}° (southern hemisphere), stars with δ &lt; −(90° − |φ|) = −{up}° never set, and stars with δ &gt; 90° − |φ| = {up}° never rise. So {answer}."},"decGiven":"The star’s declination is δ = {dec}.","alt":{"text":"What is the highest altitude above the horizon that <b>{star}</b> reaches in {city} (φ = {lat}°)? Answer in degrees.","solution":"The star’s declination is δ = {dec} ≈ {decd}°. At upper culmination h = 90° − |φ − δ| = 90° − |{lat}° − ({decd}°)| ≈ {h}°."},"lat":{"text":"At upper culmination <b>{star}</b> rises south of the zenith to an altitude of {h}°. At what latitude is the observer? Answer in degrees.","solution":"For a culmination south of the zenith h = 90° − φ + δ, so φ = 90° − h + δ. The star’s declination is δ ≈ {decd}°, so φ = 90° − {h}° + ({decd}°) ≈ {lat}°.","textSouth":"At upper culmination <b>{star}</b> rises north of the zenith to an altitude of {h}°. At what latitude in the southern hemisphere is the observer? Answer in degrees, with a minus sign for southern latitude.","solutionSouth":"For a culmination north of the zenith h = 90° + φ − δ, so φ = h − 90° + δ. The star’s declination is δ ≈ {decd}°, so φ = {h}° − 90° + ({decd}°) ≈ {lat}°."},"circUp":{"text":"Which of these constellations never sets in {city} (φ = {lat}°) — all of it?","solution":"Stars with δ &gt; 90° − φ = {limit}° never set. The southernmost point of {con} is at δ ≈ {d}°, so the whole constellation is north of this limit. The others have some stars farther south.","solutionSouth":"In the southern hemisphere stars with δ &lt; −(90° − |φ|) = −{limit}° never set. The northernmost point of {con} is at δ ≈ {d}°, so the whole constellation is south of this limit. The others have some stars farther north."},"circDown":{"text":"Which of these constellations is never visible from {city} (φ = {lat}°) — not even partly?","solution":"Stars with δ &lt; −(90° − φ) = −{limit}° never rise. The northernmost point of {con} is at δ ≈ {d}°, so the whole constellation is south of this limit. The others rise above the horizon at least partly.","solutionSouth":"In the southern hemisphere stars with δ &gt; 90° − |φ| = {limit}° never rise. The southernmost point of {con} is at δ ≈ {d}°, so the whole constellation is north of this limit. The others rise above the horizon at least partly."},"sun":{"text":"In which constellation is the Sun on {date}?","solution":"By the real constellation boundaries the Sun is in {con} from about {from} to {to}. This is not a “zodiac sign”: the dates of the signs are shifted by almost a month."},"moon":{"text":"There is a full Moon on {date}. In which constellation is the Moon?","solution":"The full Moon is opposite the Sun. On {date} the Sun is in {sun}, and opposite it on the ecliptic is {con}. (The Moon strays up to 5° from the ecliptic, so sometimes it is in a neighboring constellation.)"},"midnight":{"text":"Which of these constellations is at upper culmination — at its highest above the horizon — around midnight on {date}?","solution":"On {date} the Sun’s right ascension is ≈ {sun}. At midnight the stars with α ≈ α of the Sun + 12h ≈ {target} culminate. Of the options, the closest is {con} (α ≈ {ra})."},"coords":{"text":"Which bright star has the coordinates α = {ra}, δ = {dec}?","solution":"It is {star} ({desig}), {mag}."},"desig":{"text":"What is the Bayer designation of <b>{star}</b>?","solution":"{star} is {desig} ({latin})."},"desigBack":{"text":"Which star is <b>{desig}</b>?"},"conOf":{"text":"In which constellation is <b>{name}</b>?","solution":"{name} is in {con}."},"zodiac":{"text":"Which of these constellations is not in the zodiac — the Sun never passes through it?","solution":"The Sun passes through 13 constellations: {list}. {con} is not among them."},"mw":{"text":"Which of these constellations does the Milky Way not pass through?","solution":"The Milky Way passes through {yes}, but {con} lies away from it: in that direction we look “sideways” out of the disk of the Galaxy."}},"cities":{"murmansk":"Murmansk","reykjavik":"Reykjavík","spb":"Saint Petersburg","moscow":"Moscow","novosibirsk":"Novosibirsk","london":"London","sochi":"Sochi","vladivostok":"Vladivostok","cairo":"Cairo","singapore":"Singapore","rio":"Rio de Janeiro","sydney":"Sydney","capetown":"Cape Town","buenosaires":"Buenos Aires","auckland":"Auckland"},"solved":{"orion-month":{"text":"An observer in Moscow sees Orion high in the south at midnight — the constellation is at upper culmination. Which month is it?","options":["March","June","September","December"],"solution":"The right ascension of Orion is ≈ 5.5h. At midnight the stars culminating in the south have α ≈ α of the Sun + 12h, so the Sun’s α ≈ 17.5h. The Sun has α = 18h on December 22, and 17.5h about the middle of December. That is why Orion is a “winter” constellation."},"circumpolar-moscow":{"text":"Which of these stars never sets in Moscow (φ = 55.8°)?","options":["Arcturus","Altair","Vega","Aldebaran"],"solution":"Stars with δ &gt; 90° − φ = 34.2° never set. Declinations: Vega +38.8°, Arcturus +19.2°, Aldebaran +16.5°, Altair +8.9°. Only Vega qualifies."},"sochi-spb":{"text":"Which of these stars can be seen from Sochi (φ = 43.6°) but not from Saint Petersburg (φ = 59.9°)? Mark all correct ones.","options":["Sirius","Shaula (λ Scorpii)","Kaus Australis (ε Sagittarii)","Canopus","Antares"],"solution":"A star rises if δ &gt; −(90° − φ). For Sochi the limit is −46.4°, for Saint Petersburg −30.1°. Sirius (−16.7°) and Antares (−26.4°) are visible from both cities, Canopus (−52.7°) from neither. Shaula (−37.1°) and Kaus Australis (−34.4°) are between the limits: they are visible from Sochi but not from Saint Petersburg."},"solstice-con":{"text":"In which constellation is the summer solstice point now — the place on the ecliptic where the Sun is on June 21?","options":["Cancer","Gemini","Taurus","Virgo"],"solution":"The Tropic of Cancer got its name because 2000 years ago the Sun was in Cancer at the summer solstice. Because of precession the solstice point moves west along the ecliptic (1° in 72 years): it passed through Gemini and has been in Taurus since 1990, still only 0.1° from the border. So on the day of the solstice the Sun stands at the border of Taurus and Gemini."},"equinox-point":{"text":"In which constellation is the vernal equinox point (α = 0h, δ = 0°) now?","options":["Aries","Pisces","Aquarius","Virgo"],"solution":"It is traditionally called the “First Point of Aries”, but because of precession it has been in Pisces for about 2000 years (and will move into Aquarius in about 600 years). The autumnal equinox point is in Virgo."},"ecliptic-four":{"text":"What do the stars Aldebaran, Regulus, Spica and Antares have in common?","options":["all four are red giants","all four lie close to the ecliptic","all four never set in Moscow","all four belong to one constellation"],"solution":"All four are bright stars of zodiac constellations (Taurus, Leo, Virgo, Scorpius) right by the ecliptic, so the Moon and planets often pass near them, and the Moon can cover them. Their colors differ: Regulus and Spica are blue-white. In Moscow all four set."},"sirius-lat":{"text":"North of what latitude does Sirius (δ = −16°43′) never rise above the horizon? Answer in degrees.","solution":"A star never rises if δ &lt; −(90° − φ), that is, φ &gt; 90° + δ = 90° − 16.7° = 73.3°. For example, from Svalbard (78° N) Sirius is never seen."},"brightness-order":{"text":"Which order goes from the brightest star to the faintest?","options":["Vega, Sirius, Polaris, Betelgeuse","Polaris, Sirius, Vega, Betelgeuse","Sirius, Vega, Betelgeuse, Polaris","Sirius, Polaris, Vega, Betelgeuse"],"solution":"Magnitudes: Sirius −1.4<sup>m</sup>, Vega 0.0<sup>m</sup>, Betelgeuse ≈ 0.5<sup>m</sup> (variable), Polaris 2.0<sup>m</sup>. Polaris is far from the brightest star: it is about 48th in brightness."},"ori-sco":{"text":"Can Betelgeuse (α Orionis) and Antares (α Scorpii) be above the horizon at the same time as seen from Moscow?","options":["yes, in summer","yes, in winter","no, never","yes, in spring before dawn"],"solution":"In Moscow Antares (α ≈ 16.5h, δ ≈ −26°) is above the horizon only for about ±2.9h around culmination, and Betelgeuse (α ≈ 5.9h, δ ≈ +7°) for about ±6.7h. Betelgeuse sets when the sidereal time is ≈ 12.7h, while Antares rises only at ≈ 13.6h: the intervals do not overlap. In the myth the Scorpion and Orion are always on opposite sides of the sky."},"summer-triangle-season":{"text":"In which season, in the evening (around 10–11 pm), is the Summer Triangle — Vega, Deneb, Altair — high in the south as seen from Moscow?","options":["in winter","in spring","in late summer — early autumn","in late autumn"],"solution":"The right ascension of the triangle’s stars is ≈ 19–21h. At midnight the south has α ≈ α of the Sun + 12h, and 1–2 hours earlier α ≈ α of the Sun + 10–11h. Hence the Sun’s α ≈ 8.5–10h, which is August and early September. Despite its name, in June the triangle gets high only in the second half of the night."},"zenith-moscow":{"text":"Which of these stars culminates closest to the zenith in Moscow (φ = 55.8°)?","options":["Vega","Altair","Arcturus","Capella"],"solution":"At upper culmination the zenith distance is z = |φ − δ|. Capella (δ = +46.0°): z ≈ 9.8°; Vega (+38.8°): z ≈ 17.0°; Arcturus (+19.2°): z ≈ 36.6°; Altair (+8.9°): z ≈ 46.9°."},"polaris-height":{"text":"At what altitude above the horizon is Polaris seen from Saint Petersburg (φ = 59.9°)? Answer in degrees.","solution":"The altitude of the celestial pole equals the latitude, and Polaris is less than 1° from the pole. So its altitude ≈ φ ≈ 60° (during a day it changes by ±0.7°)."},"noon-sun-height":{"text":"What is the altitude of the Sun at noon on June 22 in Moscow (φ = 55.8°)? Answer in degrees.","solution":"On the day of the summer solstice the Sun’s declination is δ = +23.4°. At noon the Sun is at upper culmination: h = 90° − φ + δ = 90° − 55.8° + 23.4° ≈ 57.7°."},"equator-all":{"text":"What part of the starry sky can an observer at the Earth’s equator see during a year?","options":["only the stars of the northern celestial hemisphere","the whole sky","only the stars near the celestial equator","exactly half of the sky"],"solution":"At the equator the celestial axis lies in the plane of the horizon: every star rises, sets and spends half a day above the horizon. During a year the Sun goes around the whole sky, so all the stars are seen at night in turn — from Polaris to σ Octantis at the south pole."},"pole-sirius":{"text":"Can Sirius (δ = −16.7°) be seen from the Earth’s North Pole?","options":["yes, in winter","yes, in summer","no, never","yes, all year, low above the horizon"],"solution":"At the pole the celestial pole is at the zenith and the celestial equator coincides with the horizon. Only the stars of the northern celestial hemisphere (δ &gt; 0) are visible, and they neither rise nor set but circle parallel to the horizon. Sirius is south of the equator, so it is never seen there."},"vega-lower":{"text":"Vega (δ = +38.8°) never sets in Moscow (φ = 55.8°). How high above the horizon is it at lower culmination — the lowest point of its path? Answer in degrees.","solution":"At lower culmination a star passes below the celestial pole, and its altitude is h = φ + δ − 90° = 55.8° + 38.8° − 90° ≈ 4.5°. Vega never sets, but at lower culmination — for example, around midnight in late December — it almost touches the northern horizon."},"sun-ophiuchus":{"text":"In which constellation is the Sun on December 5?","options":["Scorpius","Ophiuchus","Sagittarius","Libra"],"solution":"By the real constellation boundaries the Sun crosses Ophiuchus from about November 30 to December 17 — longer than Scorpius (about a week). In the astrological calendar December 5 is “Sagittarius”, but the signs do not match the constellations: precession has shifted their dates by almost a month."}}}};
