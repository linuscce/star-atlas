# Публикация сайта на GitHub Pages при каждом push в main.
# Сайт собирается заново из src/ и таблиц texts/, проверяются уроки и переводы (npm test), затем выкладывается
# папка public/ (/ → /ru/ или /en/) и рядом с ней star-atlas-ru.html, star-atlas-en.html —
# приложение одним файлом для телефона без интернета (на них ссылается главная страница).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: |
          cp -r public _site
          cp dist/star-atlas-*.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
